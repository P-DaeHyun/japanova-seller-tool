<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOWA v0.10</title>
<style>
:root{--ink:#22222b;--navy:#292b48;--paper:#fffdfa;--line:#e5ddd2;--muted:#77727a;--gold:#b48746;--cream:#f7f2ea}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f3eee7,#faf8f3);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:900px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;padding:24px;margin-bottom:16px;box-shadow:0 12px 35px rgba(34,30,45,.05)}.hero{display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden;padding:0}.copy{padding:36px}.visual{min-height:430px;background:radial-gradient(circle at 68% 30%,#e8d8b1 0 6%,transparent 6.5%),radial-gradient(circle at 65% 30%,#fbf4de 0 15%,transparent 15.5%),linear-gradient(155deg,#222746,#575c7b);position:relative}.visual:before{content:"TOWA";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);color:#fff;font:700 55px Georgia,serif;letter-spacing:.12em}.visual:after{content:"ずっと、あなたを知っていく。";position:absolute;left:24px;right:24px;bottom:26px;color:white;text-align:center;font:18px Georgia,"Yu Mincho",serif}.logo{font:800 40px Georgia,serif;letter-spacing:.14em;color:var(--navy)}.logo small{font:600 11px sans-serif;display:block;letter-spacing:.18em;color:#847b72;margin-top:4px}.beta{display:inline-block;padding:6px 10px;background:#ece9f2;color:var(--navy);border-radius:999px;font-size:12px;font-weight:800;margin-top:16px}h1{font:36px/1.4 Georgia,"Yu Mincho",serif;margin:18px 0 10px}h2{font-size:25px}.muted{color:var(--muted);line-height:1.9}.status{margin-top:14px;padding:12px;border-radius:14px;background:#f0ece5;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid #ddd5cc;border-radius:13px;background:white}button{border:0;border-radius:14px;padding:13px 17px;background:var(--navy);color:white;font-weight:800;cursor:pointer}.secondary,.topic{background:white;color:var(--navy);border:1px solid #d8d0c8}.topic{margin:4px;background:#f7f3ed}.hidden{display:none!important}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.p{padding:13px;text-align:center;border:1px solid var(--line);border-radius:15px}.p b{display:block;font-size:22px;color:var(--navy);margin-top:4px}.mapHead{text-align:center;padding:20px 5px}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--gold)}.mapTitle{font:34px Georgia,"Yu Mincho",serif;margin:8px 0}.profiles{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.prof{border:1px solid var(--line);border-radius:17px;padding:14px;background:linear-gradient(#fff,#fbf8f3)}.prof span{font-size:11px;color:#877f76}.prof strong{display:block;color:var(--navy);font-size:17px;margin:6px 0}.prof small{color:var(--muted);line-height:1.45}.story{margin-top:32px}.storyTop{display:flex;gap:12px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:11px}.lab{font:800 12px Georgia,serif;letter-spacing:.14em;color:var(--gold)}.ttl{font:29px Georgia,"Yu Mincho",serif;margin:0}.panel{min-height:230px;margin:17px 0;border-radius:24px;background:linear-gradient(135deg,#242742,#4b5071);position:relative;overflow:hidden}.panel:before{content:"☾";position:absolute;left:10%;top:10%;font-size:130px;color:rgba(255,255,255,.08)}.panel:after{content:"TOWA";position:absolute;left:9%;bottom:14%;font:700 44px Georgia,serif;color:rgba(255,255,255,.14);letter-spacing:.12em}.bubble{position:absolute;z-index:2;right:24px;top:50%;transform:translateY(-50%);width:52%;font:20px/1.65 Georgia,"Yu Mincho",serif;color:white}.prose,.topicBlock{background:white;border:1px solid var(--line);border-radius:20px;padding:21px}.prose p,.topicBlock p{line-height:1.9;margin:0 0 14px}.note{padding:13px 15px;border-left:4px solid var(--gold);background:#f4efe7;border-radius:12px;font-weight:700;line-height:1.7}.topicBlock{margin:12px 0}.rank{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:.12em}.topicLine{font:700 18px/1.6 Georgia,"Yu Mincho",serif;color:var(--navy)}.letter{background:linear-gradient(145deg,#252743,#383c61);color:#fff;border-radius:24px;padding:26px}.letter .note{background:rgba(255,255,255,.09)}.guide{margin-top:25px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fbf8f3}details{margin-top:18px;color:var(--muted)}pre{white-space:pre-wrap;font-size:12px}.loading{font-weight:700;color:var(--navy)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.visual{min-height:300px;order:-1}.copy{padding:24px}.grid{grid-template-columns:1fr}.pillars{grid-template-columns:1fr 1fr}.profiles{grid-template-columns:1fr 1fr}.profiles .prof:last-child{grid-column:1/-1}.panel{min-height:300px}.bubble{left:22px;right:22px;top:auto;bottom:24px;transform:none;width:auto}.ttl{font-size:25px}}
</style></head><body><div class="w">
<section class="card hero"><div class="copy"><div class="logo">T☾WA<small>AI占い × 四柱推命</small></div><span class="beta">v0.10 · OpenAI API不要</span><h1>あなたという人の<br>地図をひらく。</h1><p class="muted">変わりにくいあなたの核と、今動いている流れを重ねて読む。生成AIではなく、確定した四柱推命データからTOWA MAPを組み立てるよ。</p><div id="infra" class="status">接続状態を確認中…</div></div><div class="visual"></div></section>
<section id="auth" class="card"><h2>ログイン / 新規登録</h2><div class="grid"><input id="email" placeholder="メールアドレス"><input id="pw" type="password" placeholder="パスワード（8文字以上）"><input id="name" placeholder="お名前"></div><p><button id="login">ログイン</button> <button id="reg" class="secondary">新規登録</button></p><div id="msg"></div></section>
<div id="app" class="hidden"><section class="card"><h2>出生情報</h2><p class="muted">TOWAが命式を計算して、あなた専用のMAPを組み立てるよ。</p><div class="grid"><select id="gender"><option value="male">男性</option><option value="female">女性</option></select><input id="birth" type="date"><input id="time" type="time"></div><p><button id="read">TOWA MAPをひらく</button></p><div id="readmsg" class="loading"></div></section><section id="result" class="card hidden"></section></div>
</div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"error");return d};
async function health(){try{const h=await api("/api/health");$("#infra").textContent="四柱推命エンジン ✓ · TOWA MAP ✓ · API料金 ¥"+h.api_cost_jpy+" · "+(h.database_ready?"記憶DB ✓":"DB確認中")}catch{}}
function pillars(c){const p=c?.pillars||{};return '<div class="pillars">'+[["年柱",p.year],["月柱",p.month],["日柱",p.day],["時柱",p.hour]].map(([l,x])=>'<div class="p">'+l+'<b>'+(x?esc(x.stem+x.branch):"不明")+'</b></div>').join("")+'</div>'}
function story(s){return '<section class="story"><div class="storyTop"><div class="lab">'+esc(s.label)+'</div><h3 class="ttl">'+esc(s.title)+'</h3></div><div class="panel"><div class="bubble">「'+esc(s.towa_line)+'」</div></div><div class="prose">'+(s.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="note">TOWA NOTE｜'+esc(s.note)+'</div></div></section>'}
function pathSec(p){return '<section class="story"><div class="storyTop"><div class="lab">'+esc(p.label)+'</div><h3 class="ttl">'+esc(p.title)+'</h3></div><div class="panel"><div class="bubble">「'+esc(p.towa_line)+'」</div></div>'+(p.ordered_topics||[]).map((t,i)=>'<div class="topicBlock"><div class="rank">PRIORITY 0'+(i+1)+'</div><h3>'+esc(t.title)+'</h3><div class="topicLine">'+esc(t.towa_line)+'</div>'+(t.paragraphs||[]).map(x=>'<p>'+esc(x)+'</p>').join("")+'<div class="note">TOWA NOTE｜'+esc(t.note)+'</div></div>').join("")+'<div class="note">'+esc(p.note)+'</div></section>'}
function render(c,r){const root=$("#result");root.innerHTML='<div class="mapHead"><div class="eyebrow">TOWA MAP</div><div class="mapTitle">あなたという人の地図</div><p class="muted">'+esc(r.opening)+'</p></div>'+pillars(c)+'<div class="profiles">'+(r.profile_cards||[]).map(x=>'<div class="prof"><span>'+esc(x.label)+'</span><strong>'+esc(x.value)+'</strong><small>'+esc(x.note)+'</small></div>').join("")+'</div>'+story(r.core)+story(r.flow)+pathSec(r.path)+story(r.turning_point)+story(r.next)+'<section class="story"><div class="storyTop"><div class="lab">'+esc(r.letter.label)+'</div><h3 class="ttl">'+esc(r.letter.title)+'</h3></div><div class="letter"><h3>「'+esc(r.letter.towa_line)+'」</h3>'+(r.letter.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="note">TOWA NOTE｜'+esc(r.letter.note)+'</div></div></section><div class="guide"><h3>TOWAにもう少し聞いてみる</h3><p class="muted">自由会話AIではなく、命式から選んだテーマをもう少し深く読むよ。API料金は0円。</p><button class="topic" data-topic="work">仕事</button><button class="topic" data-topic="money">お金</button><button class="topic" data-topic="love">恋愛</button><button class="topic" data-topic="people">人間関係</button><button class="topic" data-topic="now">今の流れ</button><div id="guideResult"></div></div><details><summary>TOWAが見た命式の根拠</summary><pre>'+esc(JSON.stringify(r.evidence,null,2))+'</pre></details>';root.classList.remove("hidden");root.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>guide(b.dataset.topic))}
async function guide(t){const x=$("#guideResult");x.textContent="読み直してる…";try{const d=await api("/api/guidance",{method:"POST",body:JSON.stringify({topic:t})}),a=d.answer;x.innerHTML='<div class="topicBlock"><h3>'+esc(a.title)+'</h3><div class="topicLine">'+esc(a.towa_line)+'</div>'+(a.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="note">TOWA NOTE｜'+esc(a.note)+'</div></div>'}catch(e){x.textContent=e.message}}
async function me(){try{const d=await api("/api/me");$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");if(d.birth_profile){$("#gender").value=d.birth_profile.gender;$("#birth").value=d.birth_profile.birth_date;$("#time").value=(d.birth_profile.birth_time||"").slice(0,5)}if(d.latest_report?.reading&&d.chart&&d.latest_report.engine==="towa-rules-v0.10")render(d.chart,d.latest_report.reading)}catch{}}
$("#login").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#reg").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value,display_name:$("#name").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#read").onclick=async()=>{try{$("#readmsg").textContent="命式を読み、TOWA MAPを組み立ててる…";const d=await api("/api/reading",{method:"POST",body:JSON.stringify({profile:{gender:$("#gender").value,birth_date:$("#birth").value,birth_time:$("#time").value||null,birth_time_known:Boolean($("#time").value)}})});render(d.chart,d.reading);$("#readmsg").textContent="APIを使わず、あなたのMAPを作ったよ。";$("#result").scrollIntoView({behavior:"smooth"})}catch(e){$("#readmsg").textContent=e.message}};
health();me();
</script></body></html>
