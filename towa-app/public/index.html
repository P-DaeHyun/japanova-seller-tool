const SCENE={
 CORE:"たとえば、その場では『大丈夫』と答えたのに、帰宅して静かになってから『本当は少し違ったかも』と自分の答えがまとまる。そんな時間差も、考える材料を多く受け取る人には自然なこと。",
 FLOW:"前なら流せた頼まれごとや働き方が、最近なぜか強く疲れる。そんな小さな変化も、『わがままになった』のではなく、守りたい基準が動き始めたサインとして見られる。",
 work:"会議中は『どちらでもいいです』と言えたのに、帰宅してから改善案が次々浮かぶ。そんな時は、能力不足ではなく『自分の判断を使える余地』が足りないのかもしれない。",
 money:"買うか迷った時、値段より『この先困らないか』が気になって何度も残高を確認する。見通しが作れると、使う時にも安心しやすい。",
 love:"返信が少し遅いだけで『何か変わった？』と考え始める。でも確認する前に答えを作ってしまうと疲れる。小さな不安ほど、小さいうちに言葉にできると楽になる。",
 people:"頼まれごとをその場では断れず、終わったあとにどっと疲れる。そんな時は『できるか』より『自分が持つべき役割か』を一度分けて考えてみて。",
 TURNING:"転職を決める前に求人を保存し始める、付き合い方を変える前に連絡頻度を減らしてみる。転機は、大きな決断より先に小さな準備として現れることがある。",
 NEXT:"新しい誘いや話が増えた時、すぐ全部を受け取るより一晩置いて『誰と何に時間を使いたい？』を決める。そんな小さな選び方が一年の流れを整える。"
};
function firstLead(p){const i=p.indexOf("。");if(i<0)return '<strong class="leadSentence">'+esc(p)+'</strong>';return '<strong class="leadSentence">'+esc(p.slice(0,i+1))+'</strong>'+esc(p.slice(i+1))}
function paraBlock(ps,limit){ps=ps||[];const first=ps.slice(0,limit),rest=ps.slice(limit);let h=first.map((p,i)=>'<p>'+(i===0?firstLead(p):esc(p))+'</p>').join("");if(rest.length)h+='<details class="more"><summary>もう少し読む</summary>'+rest.map(p=>'<p>'+esc(p)+'</p>').join("")+'</details>';return h}
function scene(key){const s=SCENE[key];return s?'<div class="scene"><b>こんな時に出やすい</b>'+esc(s)+'</div>':""}
function noteLabel(key){return({CORE:"TOWA KEY",FLOW:"覚えておいて",TURNING:"TOWA KEY",NEXT:"今できること",LETTER:"TOWA NOTE",work:"今のヒント",money:"今のヒント",love:"今のヒント",people:"今のヒント"}[key]||"TOWA NOTE")}
function termHints(text){const xs=Object.keys(TERM).filter(k=>String(text||"").includes(k));return xs.length?'<div class="terms">'+xs.map(k=>'<span class="term"><b>'+k+'</b><small>'+esc(TERM[k])+'</small></span>').join("")+'</div>':""}
function panelClass(label){return label==="CORE"?"panel-core":label==="FLOW"?"panel-flow":label==="PATH"?"panel-path":label==="TURNING POINT"?"panel-turning":label==="NEXT"?"panel-next":"panel-core"}
async function health(){try{const h=await api("/api/health");$("#infra").textContent="四柱推命エンジン ✓ · TOWA MAP ✓ · "+(h.database_ready?"保存 ✓":"保存確認中")}catch{}}
function pillars(c){const p=c?.pillars||{};return '<div class="pillars">'+[["年柱",p.year],["月柱",p.month],["日柱",p.day],["時柱",p.hour]].map(([l,x])=>'<div class="p">'+l+'<b>'+(x?esc(x.stem+x.branch):"不明")+'</b></div>').join("")+'</div>'}
function story(s,key){const text=[s.towa_line].concat(s.paragraphs||[]).join(" ");return '<section class="story"><div class="storyTop"><div class="lab">'+esc(s.label)+'</div><h3 class="ttl">'+esc(s.title)+'</h3></div><div class="panel '+panelClass(s.label)+'"><div class="bubble">「'+esc(s.towa_line)+'」</div></div>'+termHints(text)+'<div class="prose">'+paraBlock(s.paragraphs,3)+scene(key)+'<div class="note">'+noteLabel(key)+'｜'+esc(s.note)+'</div></div></section>'}
function topicKey(title){return title.startsWith("仕事")?"work":title.startsWith("お金")?"money":title.startsWith("恋愛")?"love":"people"}
function pathSec(p){return '<section class="story"><div class="storyTop"><div class="lab">'+esc(p.label)+'</div><h3 class="ttl">'+esc(p.title)+'</h3></div><div class="panel panel-path"><div class="bubble">「'+esc(p.towa_line)+'」</div></div>'+(p.ordered_topics||[]).map((t,i)=>{const k=topicKey(t.title),text=t.towa_line+" "+(t.paragraphs||[]).join(" ");return '<div class="topicBlock"><div class="rank">PRIORITY 0'+(i+1)+'</div><h3>'+esc(t.title)+'</h3><div class="topicLine">'+esc(t.towa_line)+'</div>'+termHints(text)+paraBlock(t.paragraphs,3)+scene(k)+'<div class="note">'+noteLabel(k)+'｜'+esc(t.note)+'</div></div>'}).join("")+'<div class="note pathFooter">この順番の見方｜'+esc(p.note)+'</div></section>'}
function letterSec(l){return '<section class="story"><div class="storyTop"><div class="lab">'+esc(l.label)+'</div><h3 class="ttl">'+esc(l.title)+'</h3></div><div class="letter"><h3>「'+esc(l.towa_line)+'」</h3>'+paraBlock(l.paragraphs,5)+'<div class="note">'+noteLabel("LETTER")+'｜'+esc(l.note)+'</div></div></section>'}
function render(c,r){const root=$("#result");root.innerHTML='<div class="mapHead"><div class="eyebrow">TOWA MAP</div><div class="mapTitle">あなたという人の地図</div><p class="muted">'+esc(r.opening)+'</p></div>'+pillars(c)+'<div class="profiles">'+(r.profile_cards||[]).map(x=>'<div class="prof"><span>'+esc(x.label)+'</span><strong>'+esc(x.value)+'</strong><small>'+esc(x.note)+'</small></div>').join("")+'</div>'+story(r.core,"CORE")+story(r.flow,"FLOW")+pathSec(r.path)+story(r.turning_point,"TURNING")+story(r.next,"NEXT")+letterSec(r.letter)+'<div class="guide"><h3>TOWAにもう少し聞いてみる</h3><p class="muted">自由入力の相談ではなく、命式から選んだテーマをもう少し深く読むよ。</p><button class="topic" data-topic="work">仕事</button><button class="topic" data-topic="money">お金</button><button class="topic" data-topic="love">恋愛</button><button class="topic" data-topic="people">人間関係</button><button class="topic" data-topic="now">今の流れ</button><div id="guideResult"></div></div><details class="evidence"><summary>TOWAが見た命式の根拠</summary><pre>'+esc(JSON.stringify(r.evidence,null,2))+'</pre></details>';root.classList.remove("hidden");root.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>guide(b.dataset.topic))}
async function guide(t){const x=$("#guideResult");x.textContent="読み直してる…";try{const d=await api("/api/guidance",{method:"POST",body:JSON.stringify({topic:t})}),a=d.answer,k=t==="now"?"FLOW":t;x.innerHTML='<div class="topicBlock"><h3>'+esc(a.title)+'</h3><div class="topicLine">'+esc(a.towa_line)+'</div>'+termHints(a.towa_line+" "+(a.paragraphs||[]).join(" "))+paraBlock(a.paragraphs,3)+scene(t)+ '<div class="note">'+noteLabel(k)+'｜'+esc(a.note)+'</div></div>'}catch(e){x.textContent=e.message}}
async function me(){try{const d=await api("/api/me");$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");if(d.birth_profile){$("#gender").value=d.birth_profile.gender;$("#birth").value=d.birth_profile.birth_date;$("#time").value=(d.birth_profile.birth_time||"").slice(0,5)}if(d.latest_report?.reading&&d.chart&&d.latest_report.engine==="towa-rules-v0.11")render(d.chart,d.latest_report.reading)}catch{}}
$("#login").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#reg").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value,display_name:$("#name").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#read").onclick=async()=>{try{$("#readmsg").textContent="命式を読み、TOWA MAPを組み立ててる…";const d=await api("/api/reading",{method:"POST",body:JSON.stringify({profile:{gender:$("#gender").value,birth_date:$("#birth").value,birth_time:$("#time").value||null,birth_time_known:Boolean($("#time").value)}})});render(d.chart,d.reading);$("#readmsg").textContent="あなたのMAPを作ったよ。";$("#result").scrollIntoView({behavior:"smooth"})}catch(e){$("#readmsg").textContent=e.message}};
health();me();
</script></body></html>
