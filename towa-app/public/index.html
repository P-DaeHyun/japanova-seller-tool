<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOWA v0.8</title><style>
body{margin:0;background:#f7f5f0;color:#25252c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:850px;margin:auto;padding:16px}.c{background:#fff;border:1px solid #e7e2da;border-radius:24px;padding:22px;margin-bottom:14px}.logo{font-weight:900;font-size:42px;letter-spacing:.1em}.muted{color:#777780;line-height:1.8}.status{padding:12px;border-radius:14px;background:#efebe4;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{font:inherit}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:12px}button{border:0;border-radius:12px;padding:12px 16px;background:#343449;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#343449;border:1px solid #ddd}.hidden{display:none}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.p{padding:15px;text-align:center;border:1px solid #ddd;border-radius:14px}.p b{display:block;font-size:22px}.chap{border-top:1px solid #eee;padding:14px 0}.lock{opacity:.45}.hero{min-height:250px;display:grid;place-items:center;background:linear-gradient(145deg,#e7e6ed,#f4eee5);border-radius:20px;font-size:72px}@media(max-width:650px){.grid{grid-template-columns:1fr}.pillars{grid-template-columns:1fr 1fr}}</style></head><body><div class="w">
<div class="c"><div class="logo">T☾WA</div><h1>ずっと、あなたを知っていく。</h1><p class="muted">AI占い × 四柱推命。v0.8では公開バックエンド・Postgres・AI・Stripeを分離して接続する構成にしたよ。</p><div class="hero">☾</div><div id="infra" class="status">接続状態を確認中…</div></div>
<div id="auth" class="c"><h2>ログイン / 新規登録</h2><div class="grid"><input id="email" placeholder="メールアドレス"><input id="pw" type="password" placeholder="パスワード（8文字以上）"><input id="name" placeholder="お名前"></div><p><button id="login">ログイン</button> <button id="reg" class="secondary">新規登録</button></p><div id="msg"></div></div>
<div id="app" class="hidden"><div class="c"><h2>出生情報</h2><div class="grid"><select id="gender"><option value="male">男性</option><option value="female">女性</option></select><input id="birth" type="date"><input id="time" type="time"></div><p><button id="read">TOWAに鑑定してもらう</button></p><div id="readmsg"></div></div><div id="result" class="c hidden"><div class="pillars"><div class="p">年柱<b id="y"></b></div><div class="p">月柱<b id="m"></b></div><div class="p">日柱<b id="d"></b></div><div class="p">時柱<b id="h"></b></div></div><h2>あなたの6つの物語</h2><div id="chapters"></div></div></div>
</div><script>
const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"error");return d};
async function health(){const h=await api("/api/health");$("#infra").textContent="TOWA v0.8 · "+(h.database_ready?"DB ✓":"DB 未接続")+" · "+(h.openai_configured?"AI ✓":"AI 未接続")+" · "+(h.stripe_configured?"Stripe ✓":"Stripe 未接続")}
async function me(){try{const d=await api("/api/me");$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");if(d.birth_profile){$("#gender").value=d.birth_profile.gender;$("#birth").value=d.birth_profile.birth_date;$("#time").value=(d.birth_profile.birth_time||"").slice(0,5)}}catch{}}
$("#login").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#reg").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value,display_name:$("#name").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#read").onclick=async()=>{try{$("#readmsg").textContent="TOWAが読んでる…";const d=await api("/api/reading",{method:"POST",body:JSON.stringify({profile:{gender:$("#gender").value,birth_date:$("#birth").value,birth_time:$("#time").value||null,birth_time_known:Boolean($("#time").value)}})});const p=d.chart.pillars;$("#y").textContent=p.year?.stem+p.year?.branch;$("#m").textContent=p.month?.stem+p.month?.branch;$("#d").textContent=p.day?.stem+p.day?.branch;$("#h").textContent=p.hour?p.hour.stem+p.hour.branch:"不明";const root=$("#chapters");root.innerHTML="";for(const [k,c] of Object.entries(d.reading.chapters)){const el=document.createElement("div");el.className="chap";el.innerHTML="<h3>"+c.title+"</h3><p>"+c.towa_line+"</p><p class=muted>"+c.explanation+"</p>";root.appendChild(el)}$("#result").classList.remove("hidden");$("#readmsg").textContent=""}catch(e){$("#readmsg").textContent=e.message}};
health();me();</script></body></html>
