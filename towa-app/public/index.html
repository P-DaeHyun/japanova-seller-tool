<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOWA v0.11.5</title>
<style>
:root{--ink:#20212b;--navy:#292c4b;--paper:#fffdfa;--line:#e7ded3;--muted:#766f73;--gold:#b68035;--cream:#f7f1e8}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#f2eee8,#faf8f3);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.w{max-width:900px;margin:auto;padding:18px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:28px;padding:24px;margin-bottom:16px;box-shadow:0 12px 34px rgba(35,31,45,.045)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;padding:0}
.copy{padding:36px}
.visual{min-height:430px;position:relative;overflow:hidden;background:#ece9ee}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.heroArt{object-position:50% 30%}
.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,48,.02),rgba(20,24,48,.18));z-index:1}
.heroPill{position:absolute;left:20px;right:20px;bottom:22px;padding:12px 16px;border-radius:999px;background:rgba(30,33,61,.78);backdrop-filter:blur(8px);color:white;text-align:center;font:17px Georgia,"Yu Mincho",serif;z-index:2}
.logo{font:800 40px Georgia,serif;letter-spacing:.14em;color:var(--navy)}
.logo small{font:600 11px sans-serif;display:block;letter-spacing:.16em;color:#847b72;margin-top:5px}
.beta{display:inline-block;padding:6px 10px;background:#ece9f2;color:var(--navy);border-radius:999px;font-size:12px;font-weight:800;margin-top:16px}
h1{font:36px/1.4 Georgia,"Yu Mincho",serif;margin:18px 0 10px}
h2{font-size:25px}
.muted{color:var(--muted);line-height:1.9}
.status{margin-top:14px;padding:12px;border-radius:14px;background:#f0ece5;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,button{font:inherit}
input,select{width:100%;padding:13px;border:1px solid #ddd5cc;border-radius:13px;background:white}
button{border:0;border-radius:14px;padding:13px 17px;background:var(--navy);color:white;font-weight:800;cursor:pointer}
.secondary,.topic{background:white;color:var(--navy);border:1px solid #d8d0c8}
.topic{margin:4px;background:#f7f3ed}
.hidden{display:none!important}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.p{padding:13px;text-align:center;border:1px solid var(--line);border-radius:15px}
.p b{display:block;font-size:22px;color:var(--navy);margin-top:4px}
.mapHead{text-align:center;padding:20px 5px}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--gold)}
.mapTitle{font:34px Georgia,"Yu Mincho",serif;margin:8px 0}
.profiles{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.prof{border:1px solid var(--line);border-radius:17px;padding:14px;background:linear-gradient(#fff,#fbf8f3)}
.prof span{font-size:11px;color:#877f76}
.prof strong{display:block;color:var(--navy);font-size:15px;line-height:1.45;margin:6px 0}
.prof small{color:var(--muted);line-height:1.45}
.story{margin-top:34px}
.storyTop{display:flex;gap:12px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:11px}
.lab{font:800 12px Georgia,serif;letter-spacing:.14em;color:var(--gold)}
.ttl{font:29px Georgia,"Yu Mincho",serif;margin:0}
.panel{min-height:270px;margin:17px 0;border-radius:24px;position:relative;overflow:hidden;background:#252743}
.panelShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,29,56,.08),rgba(25,29,56,.78) 53%,rgba(25,29,56,.96));z-index:1}
.bubble{position:absolute;z-index:2;right:26px;top:50%;transform:translateY(-50%);width:52%;font:20px/1.7 Georgia,"Yu Mincho",serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.art-core{object-position:46% 28%}
.art-flow{object-position:58% 22%}
.art-path{object-position:50% 34%}
.art-turning{object-position:43% 22%}
.art-next{object-position:60% 20%}
.prose,.topicBlock{background:#fff;border:1px solid var(--line);border-radius:20px;padding:21px}
.prose p,.topicBlock p{line-height:1.95;margin:0 0 15px}
.leadSentence{font-weight:800;color:#191b2e}
.scene{margin:17px 0;padding:15px 16px;border-radius:15px;background:#f6f1ea;color:#51494b;line-height:1.8}
.scene b{display:block;font-size:12px;letter-spacing:.1em;color:var(--gold);margin-bottom:4px}
.note{padding:13px 15px;border-left:4px solid var(--gold);background:#f4efe7;border-radius:12px;font-weight:700;line-height:1.7}
.more{margin:5px 0 15px;padding:0 2px}
.more summary{cursor:pointer;color:#716a70;font-weight:700}
.more p{margin-top:13px}
.topicBlock{margin:12px 0}
.rank{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:.12em}
.topicLine{font:700 18px/1.65 Georgia,"Yu Mincho",serif;color:var(--navy);margin:7px 0 14px}
.terms{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.term{display:flex;gap:7px;align-items:center;border:1px solid #dfd5c8;background:#fcfaf6;border-radius:999px;padding:7px 10px}
.term b{font-size:13px}
.term small{font-size:11px;color:#746d70}
.pathFooter{margin-top:12px}
.letter{color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden;background:#252743}
.letterArt{object-position:50% 24%;opacity:.72}
.letterShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(25,29,56,.96),rgba(31,35,66,.87));z-index:1}
.letterContent{position:relative;z-index:2}
.letter h3{font:700 21px/1.7 Georgia,"Yu Mincho",serif}
.letter p{line-height:1.95}
.letter .note{background:rgba(255,255,255,.11);color:#fff;border-color:#c89b54}
.guide{margin-top:25px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fbf8f3}
details.evidence{margin-top:18px;color:var(--muted)}
pre{white-space:pre-wrap;font-size:12px}
.loading{font-weight:700;color:var(--navy)}
@media(max-width:720px){
.hero{grid-template-columns:1fr}
.visual{min-height:330px;order:-1}
.copy{padding:24px}
.grid{grid-template-columns:1fr}
.pillars{grid-template-columns:1fr 1fr}
.profiles{grid-template-columns:1fr 1fr}
.profiles .prof:last-child{grid-column:1/-1}
.panel{min-height:340px}
.panelShade{background:linear-gradient(180deg,rgba(25,29,56,.05),rgba(25,29,56,.80) 55%,rgba(25,29,56,.98))}
.art{object-position:center top}
.bubble{left:22px;right:22px;top:auto;bottom:24px;transform:none;width:auto}
.ttl{font-size:25px}
.prose,.topicBlock{padding:18px}
}
</style>
</head>
<body>
<div class="w">
<section class="card hero">
  <div class="copy">
    <div class="logo">T☾WA<small>データで読み解く四柱推命</small></div>
    <span class="beta">v0.11.5 · TOWA MAP</span>
    <h1>あなたという人の<br>地図をひらく。</h1>
    <p class="muted">生まれた日の暦を計算し、変わりにくいあなたの核と、今動いている流れを重ねて読む。未来を決めつけるためじゃなく、自分の選び方を知るための四柱推命だよ。</p>
    <div id="infra" class="status">接続状態を確認中…</div>
  </div>
  <div class="visual">
    <img class="art heroArt" src="/assets/towa-warm.webp?v=0115" alt="TOWA">
    <div class="heroShade"></div>
    <div class="heroPill">ずっと、あなたを知っていく。</div>
  </div>
</section>

<section id="auth" class="card">
  <h2>ログイン / 新規登録</h2>
  <div class="grid">
    <input id="email" placeholder="メールアドレス">
    <input id="pw" type="password" placeholder="パスワード（8文字以上）">
    <input id="name" placeholder="お名前">
  </div>
  <p><button id="login">ログイン</button> <button id="reg" class="secondary">新規登録</button></p>
  <div id="msg"></div>
</section>

<div id="app" class="hidden">
<section class="card">
  <h2>出生情報</h2>
  <p class="muted">TOWAが命式を計算して、あなた専用のMAPを組み立てるよ。</p>
  <div class="grid">
    <select id="gender"><option value="male">男性</option><option value="female">女性</option></select>
    <input id="birth" type="date">
    <input id="time" type="time">
  </div>
  <p><button id="read">TOWA MAPをひらく</button></p>
  <div id="readmsg" class="loading"></div>
</section>
<section id="result" class="card hidden"></section>
</div>
</div>

<script>
const TOWA_ART={
  hero:"/assets/towa-warm.webp?v=0115",
  core:"/assets/towa-calm.webp?v=0115",
  flow:"/assets/towa-calm.webp?v=0115",
  path:"/assets/towa-serious-v0115.webp?v=0115",
  turning:"/assets/towa-serious-v0115.webp?v=0115",
  next:"/assets/towa-serious-bright-v0115.webp?v=0115",
  letter:"/assets/towa-warm.webp?v=0115"
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"error");return d};

const TERM={比肩:"自分軸と独立心",劫財:"人との競争・協力",食神:"自然体と余裕",傷官:"違和感と表現",偏財:"人・情報・お金の広がり",正財:"生活と安定",七殺:"プレッシャーと決断",正官:"役割と信用",偏印:"新しい視点",正印:"学びと支え"};
const SCENE={
CORE:"たとえば、その場では『大丈夫』と答えたのに、帰宅して静かになってから『本当は少し違ったかも』と自分の答えがまとまる。そんな時間差も、考える材料を多く受け取る人には自然なこと。",
FLOW:"前なら流せた頼まれごとや働き方が、最近なぜか強く疲れる。そんな小さな変化も、『わがままになった』のではなく、守りたい基準が動き始めたサインとして見られる。",
work:"会議中は『どちらでもいいです』と言えたのに、帰宅してから改善案が次々浮かぶ。そんな時は、能力不足ではなく『自分の判断を使える余地』が足りないのかもしれない。",
money:"買うか迷った時、値段より『この先困らないか』が気になって何度も残高を確認する。見通しが作れると、使う時にも安心しやすい。",
love:"返信が少し遅いだけで『何か変わった？』と考え始める。でも確認する前に答えを作ってしまうと疲れる。小さな不安ほど、小さいうちに言葉にできると楽になる。",
people:"頼まれごとをその場では断れず、終わったあとにどっと疲れる。そんな時は『できるか』より『自分が持つべき役割か』を一度分けて考えてみて。",
TURNING:"転職を決める前に求人を保存し始める、付き合い方を変える前に連絡頻度を減らしてみる。転機は、大きな決断より先に小さな準備として現れることがある。",
NEXT:"新しい誘いや話が増えた時、すぐ全部を受け取るより一晩置いて『誰と何に時間を使いたい？』を決める。そんな小さな選び方が一年の流れを整える。"
};

function firstLead(p){const i=p.indexOf("。");if(i<0)return '<strong class="leadSentence">'+esc(p)+'</strong>';return '<strong class="leadSentence">'+esc(p.slice(0,i+1))+'</strong>'+esc(p.slice(i+1))}
function paraBlock(ps,limit){ps=ps||[];const first=ps.slice(0,limit),rest=ps.slice(limit);let h=first.map((p,i)=>'<p>'+(i===0?firstLead(p):esc(p))+'</p>').join("");if(rest.length)h+='<details class="more"><summary>もう少し読む</summary>'+rest.map(p=>'<p>'+esc(p)+'</p>').join("")+'</details>';return h}
function scene(key){const s=SCENE[key];return s?'<div class="scene"><b>こんな時に出やすい</b>'+esc(s)+'</div>':""}
function noteLabel(key){return({CORE:"TOWA KEY",FLOW:"覚えておいて",TURNING:"TOWA KEY",NEXT:"今できること",LETTER:"TOWA NOTE",work:"今のヒント",money:"今のヒント",love:"今のヒント",people:"今のヒント"}[key]||"TOWA NOTE")}
function termHints(text){const xs=Object.keys(TERM).filter(k=>String(text||"").includes(k));return xs.length?'<div class="terms">'+xs.map(k=>'<span class="term"><b>'+k+'</b><small>'+esc(TERM[k])+'</small></span>').join("")+'</div>':""}
function artClass(label){return label==="CORE"?"art-core":label==="FLOW"?"art-flow":label==="PATH"?"art-path":label==="TURNING POINT"?"art-turning":label==="NEXT"?"art-next":"art-core"}
function artFor(label){
  if(label==="CORE")return TOWA_ART.core;
  if(label==="FLOW")return TOWA_ART.flow;
  if(label==="PATH")return TOWA_ART.path;
  if(label==="TURNING POINT")return TOWA_ART.turning;
  if(label==="NEXT")return TOWA_ART.next;
  return TOWA_ART.calm;
}

async function health(){try{const h=await api("/api/health");$("#infra").textContent="四柱推命エンジン ✓ · TOWA MAP ✓ · "+(h.database_ready?"保存 ✓":"保存確認中")}catch{}}
function pillars(c){const p=c?.pillars||{};return '<div class="pillars">'+[["年柱",p.year],["月柱",p.month],["日柱",p.day],["時柱",p.hour]].map(([l,x])=>'<div class="p">'+l+'<b>'+(x?esc(x.stem+x.branch):"不明")+'</b></div>').join("")+'</div>'}

function panel(line,label){
  return '<div class="panel"><img class="art '+artClass(label)+'" src="'+artFor(label)+'" alt="TOWA"><div class="panelShade"></div><div class="bubble">「'+esc(line)+'」</div></div>';
}
function story(s,key){
  const text=[s.towa_line].concat(s.paragraphs||[]).join(" ");
  return '<section class="story"><div class="storyTop"><div class="lab">'+esc(s.label)+'</div><h3 class="ttl">'+esc(s.title)+'</h3></div>'+panel(s.towa_line,s.label)+termHints(text)+'<div class="prose">'+paraBlock(s.paragraphs,3)+scene(key)+'<div class="note">'+noteLabel(key)+'｜'+esc(s.note)+'</div></div></section>';
}
function topicKey(title){return title.startsWith("仕事")?"work":title.startsWith("お金")?"money":title.startsWith("恋愛")?"love":"people"}
function pathSec(p){
  return '<section class="story"><div class="storyTop"><div class="lab">'+esc(p.label)+'</div><h3 class="ttl">'+esc(p.title)+'</h3></div>'+panel(p.towa_line,"PATH")+
  (p.ordered_topics||[]).map((t,i)=>{const k=topicKey(t.title),text=t.towa_line+" "+(t.paragraphs||[]).join(" ");return '<div class="topicBlock"><div class="rank">PRIORITY 0'+(i+1)+'</div><h3>'+esc(t.title)+'</h3><div class="topicLine">'+esc(t.towa_line)+'</div>'+termHints(text)+paraBlock(t.paragraphs,3)+scene(k)+'<div class="note">'+noteLabel(k)+'｜'+esc(t.note)+'</div></div>'}).join("")+
  '<div class="note pathFooter">この順番の見方｜'+esc(p.note)+'</div></section>';
}
function letterSec(l){
  return '<section class="story"><div class="storyTop"><div class="lab">'+esc(l.label)+'</div><h3 class="ttl">'+esc(l.title)+'</h3></div><div class="letter"><img class="art letterArt" src="'+TOWA_ART.letter+'" alt="TOWA"><div class="letterShade"></div><div class="letterContent"><h3>「'+esc(l.towa_line)+'」</h3>'+paraBlock(l.paragraphs,5)+'<div class="note">'+noteLabel("LETTER")+'｜'+esc(l.note)+'</div></div></div></section>';
}
function render(c,r){
  const root=$("#result");
  root.innerHTML='<div class="mapHead"><div class="eyebrow">TOWA MAP</div><div class="mapTitle">あなたという人の地図</div><p class="muted">'+esc(r.opening)+'</p></div>'+
  pillars(c)+
  '<div class="profiles">'+(r.profile_cards||[]).map(x=>'<div class="prof"><span>'+esc(x.label)+'</span><strong>'+esc(x.value)+'</strong><small>'+esc(x.note)+'</small></div>').join("")+'</div>'+
  story(r.core,"CORE")+story(r.flow,"FLOW")+pathSec(r.path)+story(r.turning_point,"TURNING")+story(r.next,"NEXT")+letterSec(r.letter)+
  '<div class="guide"><h3>TOWAにもう少し聞いてみる</h3><p class="muted">自由入力の相談ではなく、命式から選んだテーマをもう少し深く読むよ。</p><button class="topic" data-topic="work">仕事</button><button class="topic" data-topic="money">お金</button><button class="topic" data-topic="love">恋愛</button><button class="topic" data-topic="people">人間関係</button><button class="topic" data-topic="now">今の流れ</button><div id="guideResult"></div></div>'+
  '<details class="evidence"><summary>TOWAが見た命式の根拠</summary><pre>'+esc(JSON.stringify(r.evidence,null,2))+'</pre></details>';
  root.classList.remove("hidden");
  root.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>guide(b.dataset.topic));
}
async function guide(t){
  const x=$("#guideResult");x.textContent="読み直してる…";
  try{
    const d=await api("/api/guidance",{method:"POST",body:JSON.stringify({topic:t})}),a=d.answer,k=t==="now"?"FLOW":t;
    x.innerHTML='<div class="topicBlock"><h3>'+esc(a.title)+'</h3><div class="topicLine">'+esc(a.towa_line)+'</div>'+termHints(a.towa_line+" "+(a.paragraphs||[]).join(" "))+paraBlock(a.paragraphs,3)+scene(t)+'<div class="note">'+noteLabel(k)+'｜'+esc(a.note)+'</div></div>';
  }catch(e){x.textContent=e.message}
}
async function me(){
  try{
    const d=await api("/api/me");
    $("#auth").classList.add("hidden");$("#app").classList.remove("hidden");
    if(d.birth_profile){$("#gender").value=d.birth_profile.gender;$("#birth").value=d.birth_profile.birth_date;$("#time").value=(d.birth_profile.birth_time||"").slice(0,5)}
    if(d.latest_report?.reading&&d.chart)render(d.chart,d.latest_report.reading);
  }catch{}
}
$("#login").onclick=async()=>{try{await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#reg").onclick=async()=>{try{await api("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("#email").value,password:$("#pw").value,display_name:$("#name").value})});me()}catch(e){$("#msg").textContent=e.message}};
$("#read").onclick=async()=>{try{$("#readmsg").textContent="命式を読み、TOWA MAPを組み立ててる…";const d=await api("/api/reading",{method:"POST",body:JSON.stringify({profile:{gender:$("#gender").value,birth_date:$("#birth").value,birth_time:$("#time").value||null,birth_time_known:Boolean($("#time").value)}})});render(d.chart,d.reading);$("#readmsg").textContent="あなたのMAPを作ったよ。";$("#result").scrollIntoView({behavior:"smooth"})}catch(e){$("#readmsg").textContent=e.message}};
health();me();
</script>
</body>
</html>
