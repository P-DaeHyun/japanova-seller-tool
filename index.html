<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA V3.2</title><style>:root{--n:#17365d;--bg:#f5f7fb;--ln:#d8dee9;--g:#087a55;--r:#b42318;--a:#b54708;--b:#175cd3}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:#182230}.wrap{max-width:1320px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 22px #0001}.top,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.actions{justify-content:flex-start}.badge{padding:6px 10px;border-radius:999px;background:#eaf1fa;font-weight:700;font-size:12px}.grid,.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:9px}.btn{padding:9px 13px;border:0;border-radius:9px;background:var(--n);color:#fff;font-weight:700;cursor:pointer}.tab{background:#e9eef5;color:var(--n)}.tab.active{background:var(--n);color:#fff}.green{background:var(--g)}.gray{background:#667085}.small{font-size:12px;color:#667085}.metric{background:#f3f7fc;padding:12px;border-radius:12px}.metric b{display:block;font-size:11px;margin-bottom:5px}.metric span{font-size:19px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:12px}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.hidden{display:none}.good{color:var(--g);font-weight:800}.bad{color:var(--r);font-weight:800}.warn{color:var(--a);font-weight:800}.decision{padding:13px;border-radius:12px;background:#f8fafc;margin-top:10px}.gate{border-left:5px solid var(--r);background:#fff1f0}.manual{background:#fbfcfe;border:1px solid #e7ebf0;border-radius:12px;padding:10px}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{font-size:12px;background:#f3f7fc;padding:7px 9px;border-radius:8px}.winner{background:#ecfdf3}h1{margin:0 0 4px}h3{margin:18px 0 10px}</style></head><body><div class="wrap"><div class="card top"><div><h1>JAPANOVA Seller Tool V3.2</h1><div class="small">공식 SLS → 실제마진 → 시장별 100점 → Best Market → Lifecycle</div></div><div><span class="badge">APP 3.2.2</span> <span id="dv" class="badge"></span> <span id="sv" class="badge"></span> <span id="fv" class="badge"></span></div></div><div class="card"><div class="top"><b>데이터 업데이트 센터</b><button class="btn" onclick="refreshFX()">환율 데이터 확인</button></div><div id="fx" class="small"></div><div id="fxstatus" class="small"></div></div><div class="card"><div class="actions"><button class="btn tab active" onclick="tab('decision',this)">상품평가</button><button class="btn tab" onclick="tab('calc',this)">국가별 계산</button><button class="btn tab" onclick="tab('db',this);renderDB()">상품 DB</button></div><h3>상품 기본정보</h3><div class="grid"><div class="field"><label>상품명</label><input id="name" value="테스트 상품" oninput="analyze()"></div><div class="field"><label>매입가 JPY</label><input id="cost" type="number" value="1000" oninput="analyze()"></div><div class="field"><label>상품 자체중량 g</label><input id="productWeight" type="number" value="180" oninput="analyze()"></div><div class="field"><label>외부포장 중량 g</label><input id="outerWeight" type="number" value="12" oninput="analyze()"></div><div class="field"><label>완충재 중량 g</label><input id="cushionWeight" type="number" value="8" oninput="analyze()"></div><div class="field"><label>외부포장비 JPY</label><input id="outerCost" type="number" value="20" oninput="analyze()"></div><div class="field"><label>완충재비 JPY</label><input id="cushionCost" type="number" value="10" oninput="analyze()"></div><div class="field"><label>국내 운임 JPY</label><input id="domesticFare" type="number" value="1350" oninput="analyze()"></div><div class="field"><label>합배송 외부박스 JPY</label><input id="consolBox" type="number" value="70" oninput="analyze()"></div><div class="field"><label>합배송 주문수</label><input id="orderCount" type="number" min="1" value="5" oninput="analyze()"></div><div class="field"><label>가로 cm</label><input id="w" type="number" value="20" oninput="analyze()"></div><div class="field"><label>세로 cm</label><input id="d" type="number" value="15" oninput="analyze()"></div><div class="field"><label>높이 cm</label><input id="h" type="number" value="5" oninput="analyze()"></div><div class="field"><label>목표 순이익률 %</label><input id="margin" type="number" value="20" oninput="analyze()"></div><div class="field"><label>Payoneer %</label><input id="payoneer" type="number" value="2" oninput="analyze()"></div><div class="field"><label>환율 변동 대비 %</label><input id="buffer" type="number" value="2" oninput="analyze()"></div><div class="field"><label>예정 할인 %</label><input id="discount" type="number" value="0" oninput="analyze()"></div><div class="field"><label>Lifecycle</label><select id="life"><option>Candidate</option><option>Test</option><option>Winner</option><option>Scale</option></select></div></div><section id="decision"><h3>6개국 경쟁가격</h3><div id="competitors" class="grid"></div><h3>리서치 평가 <span class="small">0~10</span></h3><div class="grid"><div class="manual field"><label>현지 수요 20</label><input id="demand" type="number" min="0" max="10" value="5" oninput="analyze()"></div><div class="manual field"><label>경쟁환경 15</label><input id="competition" type="number" min="0" max="10" value="5" oninput="analyze()"></div><div class="manual field"><label>일본 프리미엄 8</label><input id="premium" type="number" min="0" max="10" value="5" oninput="analyze()"></div><div class="manual field"><label>재구매 8</label><input id="repeat" type="number" min="0" max="10" value="5" oninput="analyze()"></div><div class="manual field"><label>묶음판매 5</label><input id="bundle" type="number" min="0" max="10" value="5" oninput="analyze()"></div><div class="manual field"><label>성장성 5</label><input id="growth" type="number" min="0" max="10" value="5" oninput="analyze()"></div></div><div class="top"><h3>평가 결과</h3><button class="btn green" onclick="saveProduct()">분석 결과 저장</button></div><div id="summary" class="results"></div><div id="gateBox" class="decision"></div><div id="marketTable" class="scroll"></div></section><section id="calc" class="hidden"><h3>국가별 상세 계산</h3><div class="grid"><div class="field"><label>판매국</label><select id="country" onchange="calc()"></select></div><div class="field"><label>실제 등록가(현지통화)</label><input id="actual" type="number" value="0" oninput="calc()"></div><div class="field"><label>Seller Voucher %</label><input id="voucher" type="number" value="0" oninput="calc()"></div></div><div id="results" class="results"></div><div id="feeTable" class="scroll"></div><div id="verdict" class="decision"></div></section><section id="db" class="hidden"><div class="top"><h3>상품 DB</h3><div class="actions"><button class="btn gray" onclick="exportDB()">백업 JSON</button><label class="btn gray">백업 복원<input type="file" accept="application/json" onchange="importDB(this)" hidden></label></div></div><div id="dbtable" class="scroll"></div></section></div><div class="card small">정상 수수료 기준 · 신규셀러 90일 할인 미적용 · SPS 초기 제외 · SLS RATE 2026.06.01</div></div><script>let data,cfg,markets=[];const $=x=>document.getElementById(x),n=x=>+$(x).value||0,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));function tab(id,b){['decision','calc','db'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='calc')calc()}async function load(){data=await(await fetch('./data.json?'+Date.now())).json();cfg=structuredClone(data.markets);markets=Object.keys(cfg);$('dv').textContent='DATA '+data.dataVersion;$('sv').textContent='SLS '+data.slsRateVersion;$('country').innerHTML=markets.map(c=>`<option>${c}</option>`).join('');$('competitors').innerHTML=markets.map(c=>`<div class="field"><label>${c} (${cfg[c].cur})</label><input id="cp_${c}" type="number" value="0" oninput="analyze()"></div>`).join('');await refreshFX();analyze()}async function refreshFX(){try{let r=await fetch('./fx.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;let f=await r.json();markets.forEach(c=>{let code=cfg[c].cur;if(f.jpyPer[code])cfg[c].jpyPer=f.jpyPer[code]});localStorage.setItem('japanova_fx_snapshot',JSON.stringify(f));$('fv').textContent='FX '+f.fxVersion;$('fxstatus').textContent='환율 데이터 정상 · '+new Date(f.updatedAt).toLocaleString()}catch(e){let f=JSON.parse(localStorage.getItem('japanova_fx_snapshot')||'null');if(f){markets.forEach(c=>{let code=cfg[c].cur;if(f.jpyPer[code])cfg[c].jpyPer=f.jpyPer[code]});$('fv').textContent='FX CACHE';$('fxstatus').textContent='마지막 저장 환율 사용'}else{$('fv').textContent='FX DEFAULT';$('fxstatus').textContent='기본 환율 사용'}}$('fx').textContent=markets.map(c=>cfg[c].cur+' 1 = ¥'+cfg[c].jpyPer.toFixed(cfg[c].jpyPer<.1?5:3)).join(' | ');analyze()}function packedWeight(){return n('productWeight')+n('outerWeight')+n('cushionWeight')}function packCost(){return n('outerCost')+n('cushionCost')}function domestic(){return(n('domesticFare')+n('consolBox'))/Math.max(1,n('orderCount'))}function chargeWeight(c){let g=packedWeight();if(c==='말레이시아')g=Math.max(g,n('w')*n('d')*n('h')/6000*1000);return g}function ship(c){let g=chargeWeight(c),s=cfg[c].sls;if(s.kind==='step50'){let w=Math.ceil(g/50)*50,over=w>s.maxG;w=Math.min(w,s.maxG);return{weight:w,net:Math.max(0,s.base+s.step*(w/50)),over}}if(s.kind==='sg20260601'){let over=g>30000,w,net;if(g<=500){w=Math.max(100,Math.ceil(g/100)*100);net=2.63+.23*(w/100-1)}else{w=Math.min(30000,500+Math.ceil((g-500)/250)*250);net=3.55+2.5*((w-500)/250)}return{weight:w,net,over}}if(s.kind==='vn20260601'){let over=g>20000,w=Math.min(20000,Math.max(50,Math.ceil(g/50)*50)),net;if(w<=800)net=5500+11500*(w/50-1);else net=188500+10500*((w-850)/50);return{weight:w,net,over}}return{weight:g,net:0,over:true}}function feeDetails(c,fullLocal,effectiveLocal){let x=cfg[c],items=x.feeItems.map(it=>{let base=it.base==='effective'?effectiveLocal:fullLocal;return{name:it.name,rate:it.rate,base:it.base,amount:base*it.rate}});let po=effectiveLocal*n('payoneer')/100;items.push({name:'Payoneer(설정값)',rate:n('payoneer')/100,base:'effective',amount:po});return items}function evaluateAt(c,listLocal,voucherPct=0){let x=cfg[c],baseFx=x.jpyPer,priceFx=baseFx*(1-n('buffer')/100),effective=listLocal*(1-voucherPct/100)*(1-n('discount')/100),s=ship(c),slsJPY=s.net*baseFx,f=feeDetails(c,listLocal,effective),feesLocal=f.reduce((a,b)=>a+b.amount,0),revenueJPY=effective*priceFx,costJPY=n('cost')+packCost()+domestic()+slsJPY,feeJPY=feesLocal*baseFx,profit=revenueJPY-costJPY-feeJPY,pm=revenueJPY?profit/revenueJPY:0;return{listLocal,effective,baseFx,priceFx,s,slsJPY,f,feesLocal,revenueJPY,costJPY,feeJPY,profit,pm}}function target(c,voucherPct=0){let lo=.01,hi=100;while(evaluateAt(c,hi,voucherPct).pm<n('margin')/100&&hi<1e9)hi*=2;for(let i=0;i<60;i++){let mid=(lo+hi)/2;if(evaluateAt(c,mid,voucherPct).pm>=n('margin')/100)hi=mid;else lo=mid}return evaluateAt(c,Math.ceil(hi),voucherPct)}function marginScore(pm){let p=pm*100;if(p<10)return 0;if(p<15)return 5+(p-10);if(p<20)return 10+(p-15);if(p<25)return 15+(p-20)*.6;if(p<30)return 18+(p-25)*.4;return 20}function shipScore(r){let ratio=(r.slsJPY+domestic()+packCost())/Math.max(1,r.revenueJPY);return ratio<=.10?12:ratio<=.15?10:ratio<=.20?8:ratio<=.25?6:ratio<=.30?3:0}function manual(id,max){return clamp(n(id),0,10)/10*max}function analyze(){if(!cfg)return;let rows=markets.map(c=>{let cp=n('cp_'+c),r=cp?evaluateAt(c,cp):null,t=target(c),mScore=r?marginScore(r.pm):0,sScore=shipScore(r||t),parts={demand:manual('demand',20),competition:manual('competition',15),margin:mScore,premium:manual('premium',8),shipping:sScore,repeat:manual('repeat',8),bundle:manual('bundle',5),growth:manual('growth',5)},raw=Object.values(parts).reduce((a,b)=>a+b,0),total=raw/93*100,hold=n('demand')<=2||(cp&&r.pm<.10),grade=total>=90?'SS':total>=80?'S':total>=70?'A':total>=60?'B':'C';if(!cp&&['SS','S'].includes(grade))grade='A(미조사)';if(hold&&['SS','S'].includes(grade))grade='A(Gate)';return{c,cp,r,t,parts,total,grade,hold}});let eligible=rows.filter(x=>!x.hold&&x.cp),best=eligible.sort((a,b)=>b.total-a.total)[0],action=best?(best.total>=90?'즉시 테스트 후보':best.total>=80?'우선 테스트 후보':best.total>=70?'조건부 테스트':'재검토'):'시장조사 필요';$('summary').innerHTML=`<div class="metric"><b>Best Market</b><span>${best?best.c:'-'}</span></div><div class="metric"><b>대표점수</b><span>${best?best.total.toFixed(1):'-'}</span></div><div class="metric"><b>등급</b><span>${best?best.grade:'-'}</span></div><div class="metric"><b>판정</b><span style="font-size:14px">${action}</span></div><div class="metric"><b>포장완료중량</b><span>${packedWeight()}g</span></div><div class="metric"><b>국내배송 배분</b><span>¥${Math.round(domestic())}</span></div>`;$('gateBox').className='decision';$('gateBox').innerHTML=`<b>상품성 평가</b> · 규제 위험속성 자동판정은 제거했어. 실제 판매 전 해당 상품의 국가별 최신 규정은 별도로 확인해.`;$('marketTable').innerHTML=`<table><tr><th>국가</th><th>SLS 적용중량</th><th>SLS 실부담</th><th>경쟁가</th><th>목표마진 권장가</th><th>경쟁가 마진</th><th>점수/등급</th></tr>${rows.map(x=>`<tr class="${best&&x.c===best.c?'winner':''}"><td>${x.c}</td><td>${x.t.s.weight}g${x.t.s.over?' ⚠':''}</td><td>${x.t.s.net.toFixed(2)} ${cfg[x.c].cur}</td><td>${x.cp||'-'}</td><td>${x.t.listLocal} ${cfg[x.c].cur}</td><td>${x.r?(x.r.pm*100).toFixed(1)+'%':'-'}</td><td>${x.total.toFixed(1)} / ${x.grade}</td></tr>`).join('')}</table>`;window.lastEval={best:best?best.c:null,rows:rows.map(x=>({c:x.c,total:x.total,grade:x.grade})),action}}function calc(){if(!cfg)return;let c=$('country').value,v=n('voucher'),a=n('actual'),r=a?evaluateAt(c,a,v):target(c,v);$('results').innerHTML=`<div class="metric"><b>Base FX</b><span>¥${r.baseFx.toFixed(r.baseFx<.1?5:3)}</span></div><div class="metric"><b>Price FX</b><span>¥${r.priceFx.toFixed(r.priceFx<.1?5:3)}</span></div><div class="metric"><b>SLS</b><span>${r.s.net.toFixed(2)} ${cfg[c].cur}</span></div><div class="metric"><b>${a?'실제 등록가':'권장 등록가'}</b><span>${r.listLocal} ${cfg[c].cur}</span></div><div class="metric"><b>예상 실판매가</b><span>${r.effective.toFixed(2)} ${cfg[c].cur}</span></div><div class="metric"><b>JAPANOVA 순이익</b><span>¥${Math.round(r.profit).toLocaleString()}</span></div><div class="metric"><b>순이익률</b><span>${(r.pm*100).toFixed(2)}%</span></div>`;$('feeTable').innerHTML=`<h3>수수료 계산 상세</h3><table><tr><th>항목</th><th>요율</th><th>계산 Base</th><th>금액</th></tr>${r.f.map(i=>`<tr><td>${i.name}</td><td>${(i.rate*100).toFixed(2)}%</td><td>${i.base}</td><td>${i.amount.toFixed(2)} ${cfg[c].cur}</td></tr>`).join('')}</table>`;$('verdict').innerHTML=r.pm>=n('margin')/100?'<b class="good">PASS · 목표마진 충족</b>':'<b class="warn">목표마진 미달</b>'}function snapshot(){let cp={};markets.forEach(c=>cp[c]=n('cp_'+c));return{name:$('name').value,cost:n('cost'),productWeight:n('productWeight'),outerWeight:n('outerWeight'),cushionWeight:n('cushionWeight'),outerCost:n('outerCost'),cushionCost:n('cushionCost'),domesticFare:n('domesticFare'),consolBox:n('consolBox'),orderCount:n('orderCount'),w:n('w'),d:n('d'),h:n('h'),margin:n('margin'),payoneer:n('payoneer'),buffer:n('buffer'),discount:n('discount'),life:$('life').value,demand:n('demand'),competition:n('competition'),premium:n('premium'),repeat:n('repeat'),bundle:n('bundle'),growth:n('growth'),competitors:cp,evaluation:window.lastEval,saved:new Date().toLocaleString()}}function saveProduct(){let db=JSON.parse(localStorage.getItem('japanova_products_v32')||'[]');db.unshift(snapshot());localStorage.setItem('japanova_products_v32',JSON.stringify(db));alert('V3.2 분석 결과 저장 완료')}function renderDB(){let db=JSON.parse(localStorage.getItem('japanova_products_v32')||'[]');$('dbtable').innerHTML=db.length?`<table><tr><th>상품</th><th>Best</th><th>Lifecycle</th><th>판정</th><th>저장일</th><th></th></tr>${db.map((p,i)=>`<tr><td>${p.name}</td><td>${p.evaluation?.best||'-'}</td><td>${p.life||'Candidate'}</td><td>${p.evaluation?.action||'-'}</td><td>${p.saved}</td><td><button onclick="delP(${i})">삭제</button></td></tr>`).join('')}</table>`:'저장된 상품이 없어.'}function delP(i){let db=JSON.parse(localStorage.getItem('japanova_products_v32')||'[]');db.splice(i,1);localStorage.setItem('japanova_products_v32',JSON.stringify(db));renderDB()}function exportDB(){let s=localStorage.getItem('japanova_products_v32')||'[]',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='JAPANOVA_V32_products.json';a.click()}function importDB(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;localStorage.setItem('japanova_products_v32',JSON.stringify(d));renderDB();alert('복원 완료')}catch(e){alert('올바른 JSON이 아니야')}};r.readAsText(f)}load()</script></body></html>
