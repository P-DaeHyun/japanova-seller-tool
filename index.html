<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA Seller Tool V2</title><style>:root{--navy:#17365d;--bg:#f5f7fb;--line:#d8dee9}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:#182230}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#eaf1fa;font-weight:700;font-size:12px}.grid,.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.small{font-size:12px;color:#667085}.metric{background:#f3f7fc;padding:13px;border-radius:12px}.metric b{display:block;font-size:12px;margin-bottom:6px}.metric span{font-size:20px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:13px}th:first-child,td:first-child{text-align:left}</style></head><body><div class="wrap"><div class="card top"><div><h1>JAPANOVA Seller Tool V2</h1><div class="small">Shopee 6개국 마진 · SLS · 환율 자동 갱신</div></div><div><span class="badge">APP 2.0.0</span> <span id="dv" class="badge"></span></div></div><div class="card"><div class="top"><b>자동 업데이트 센터</b><button class="btn" onclick="refreshFX()">환율 새로고침</button></div><div id="fx" class="small" style="margin-top:10px"></div></div><div class="card"><h3>상품 입력</h3><div class="grid"><div class="field"><label>판매국</label><select id="country" onchange="calc()"><option>대만</option><option>싱가포르</option><option>말레이시아</option><option>태국</option><option>필리핀</option><option>베트남</option></select></div><div class="field"><label>상품 매입가 JPY</label><input id="cost" type="number" value="1000" oninput="calc()"></div><div class="field"><label>일본 국내배송 배분 JPY</label><input id="domestic" type="number" value="300" oninput="calc()"></div><div class="field"><label>포장비/기타 JPY</label><input id="packing" type="number" value="50" oninput="calc()"></div><div class="field"><label>포장 완료 실중량 g</label><input id="weight" type="number" value="200" oninput="calc()"></div><div class="field"><label>가로 cm</label><input id="w" type="number" value="20" oninput="calc()"></div><div class="field"><label>세로 cm</label><input id="d" type="number" value="15" oninput="calc()"></div><div class="field"><label>높이 cm</label><input id="h" type="number" value="5" oninput="calc()"></div><div class="field"><label>목표 순이익률 %</label><input id="margin" type="number" value="20" oninput="calc()"></div><div class="field"><label>추가 할인/프로모션 %</label><input id="discount" type="number" value="0" oninput="calc()"></div><div class="field"><label>추가 서비스 수수료 %</label><input id="extra" type="number" value="0" oninput="calc()"></div><div class="field"><label>Payoneer %</label><input id="payoneer" type="number" value="2" oninput="calc()"></div><div class="field"><label>환율 안전마진 %</label><input id="buffer" type="number" value="2" oninput="calc()"></div></div></div><div class="card"><h3>계산 결과</h3><div id="results" class="results"></div><div id="detail" style="margin-top:14px"></div></div><div class="card"><div class="small">요금 데이터는 data.json으로 분리되어 있어 이후 데이터 업데이트가 가능해. SLS 최신 공식 기준은 Seller Centre/SEH를 최종 기준으로 확인해야 해.</div></div></div><script>let data,cfg;const n=id=>+document.getElementById(id).value||0;async function load(){data=await(await fetch('./data.json?'+Date.now())).json();cfg=structuredClone(data.markets);let saved=JSON.parse(localStorage.getItem('japanova_fx')||'null');if(saved)for(let c in cfg)if(saved[c])cfg[c].jpyPer=saved[c];document.getElementById('dv').textContent='DATA '+data.dataVersion;showFX();calc();refreshFX()}function ship(c,g,w,d,h){let s=data.markets[c].sls,cg=c==='말레이시아'?Math.max(g,w*d*h/6000*1000):g;if(s.kind==='step50')return s.base+s.step*Math.ceil(cg/50);return cg<=500?s.lowBase+s.lowStep*Math.ceil(cg/100):s.highBase+s.highStep*Math.ceil((cg-500)/250)}async function refreshFX(){try{let j=await(await fetch('https://api.frankfurter.app/latest?from=JPY&to=TWD,SGD,MYR,THB,PHP,VND')).json(),save={};for(let c in cfg){let code=cfg[c].cur;if(j.rates[code])cfg[c].jpyPer=1/j.rates[code];save[c]=cfg[c].jpyPer}localStorage.setItem('japanova_fx',JSON.stringify(save));showFX();calc()}catch(e){document.getElementById('fx').textContent+=' · 환율 서버 연결 실패: 저장값 사용'}}function showFX(){document.getElementById('fx').textContent=Object.values(cfg).map(x=>x.cur+' 1 = ¥'+x.jpyPer.toFixed(x.jpyPer<.1?5:3)).join(' | ')}function calc(){if(!cfg)return;let c=document.getElementById('country').value,x=cfg[c],base=n('cost')+n('domestic')+n('packing'),sl=ship(c,n('weight'),n('w'),n('d'),n('h')),jp=x.jpyPer*(1+n('buffer')/100),sj=sl*jp,rate=x.commission+x.payment+x.ccb+x.mdv+x.pf+n('discount')/100+n('extra')/100+n('payoneer')/100,m=n('margin')/100,fixed=x.fixed*jp,den=1-rate-m,p=den>0?(base+sj+fixed)/den:0,local=p/jp,fees=p*rate,profit=p-base-sj-fixed-fees,pm=p?profit/p:0;document.getElementById('results').innerHTML=`<div class="metric"><b>SLS 국제배송</b><span>${sl.toLocaleString(undefined,{maximumFractionDigits:2})} ${x.cur}</span></div><div class="metric"><b>권장 등록가</b><span>${Math.ceil(local).toLocaleString()} ${x.cur}</span></div><div class="metric"><b>JPY 판매가</b><span>¥${Math.round(p).toLocaleString()}</span></div><div class="metric"><b>예상 순이익</b><span>¥${Math.round(profit).toLocaleString()}</span></div><div class="metric"><b>순이익률</b><span>${(pm*100).toFixed(1)}%</span></div>`;document.getElementById('detail').innerHTML=`<table><tr><th>항목</th><th>값</th></tr><tr><td>상품+국내배송+포장</td><td>¥${base.toLocaleString()}</td></tr><tr><td>SLS JPY 환산</td><td>¥${Math.round(sj).toLocaleString()}</td></tr><tr><td>비율 수수료 합계</td><td>${(rate*100).toFixed(2)}%</td></tr><tr><td>데이터 기준</td><td>${data.dataVersion}</td></tr></table>`}load()</script></body></html>
