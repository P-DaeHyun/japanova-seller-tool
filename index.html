<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA Seller Tool V2.2</title><style>:root{--navy:#17365d;--bg:#f5f7fb;--line:#d8dee9;--green:#087a55;--red:#b42318;--amber:#b54708}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:#182230}.wrap{max-width:1220px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#eaf1fa;font-weight:700;font-size:12px}.grid,.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn.green{background:var(--green)}.btn.gray{background:#667085}.small{font-size:12px;color:#667085}.metric{background:#f3f7fc;padding:13px;border-radius:12px}.metric b{display:block;font-size:12px;margin-bottom:6px}.metric span{font-size:20px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:13px}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eef5;color:#17365d}.tab.active{background:#17365d;color:#fff}.hidden{display:none}.good{font-weight:800;color:var(--green)}.bad{font-weight:800;color:var(--red)}.warn{font-weight:800;color:var(--amber)}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{margin-top:8px;font-weight:700}</style></head><body><div class="wrap"><div class="card top"><div><h1>JAPANOVA Seller Tool V2.2</h1><div class="small">Shopee 6개국 마진 · SLS · 상품DB · 경쟁가 판단 · 6개국 비교</div></div><div><span class="badge">APP 2.2.0</span> <span id="dv" class="badge"></span> <span id="fv" class="badge"></span></div></div><div class="card"><div class="top"><b>데이터 업데이트 센터</b><button class="btn" onclick="refreshFX()">환율 데이터 확인</button></div><div id="fx" class="small" style="margin-top:10px"></div><div id="fxstatus" class="small status"></div></div><div class="card"><div class="tabs"><button class="btn tab active" onclick="tab('calc',this)">마진 계산</button><button class="btn tab" onclick="tab('compare',this);compare()">6개국 비교</button><button class="btn tab" onclick="tab('db',this);renderDB()">상품 DB</button></div><section id="calc"><h3>상품 입력</h3><div class="grid"><div class="field"><label>상품명</label><input id="name" value="테스트 상품"></div><div class="field"><label>판매국</label><select id="country" onchange="calc()"><option>대만</option><option>싱가포르</option><option>말레이시아</option><option>태국</option><option>필리핀</option><option>베트남</option></select></div><div class="field"><label>상품 매입가 JPY</label><input id="cost" type="number" value="1000" oninput="calc()"></div><div class="field"><label>일본 국내배송 배분 JPY</label><input id="domestic" type="number" value="300" oninput="calc()"></div><div class="field"><label>포장비/기타 JPY</label><input id="packing" type="number" value="50" oninput="calc()"></div><div class="field"><label>포장 완료 실중량 g</label><input id="weight" type="number" value="200" oninput="calc()"></div><div class="field"><label>가로 cm</label><input id="w" type="number" value="20" oninput="calc()"></div><div class="field"><label>세로 cm</label><input id="d" type="number" value="15" oninput="calc()"></div><div class="field"><label>높이 cm</label><input id="h" type="number" value="5" oninput="calc()"></div><div class="field"><label>목표 순이익률 %</label><input id="margin" type="number" value="20" oninput="calc()"></div><div class="field"><label>추가 할인/프로모션 %</label><input id="discount" type="number" value="0" oninput="calc()"></div><div class="field"><label>추가 서비스 수수료 %</label><input id="extra" type="number" value="0" oninput="calc()"></div><div class="field"><label>Payoneer %</label><input id="payoneer" type="number" value="2" oninput="calc()"></div><div class="field"><label>환율 안전마진 %</label><input id="buffer" type="number" value="2" oninput="calc()"></div><div class="field"><label>실제/경쟁 판매가 (현지통화)</label><input id="actual" type="number" value="0" oninput="calc()"></div></div><div class="top" style="margin-top:14px"><h3>계산 결과</h3><button class="btn green" onclick="saveProduct()">상품 저장</button></div><div id="results" class="results"></div><div id="verdict" style="margin-top:12px"></div><div id="detail" class="scroll" style="margin-top:14px"></div></section><section id="compare" class="hidden"><h3>현재 상품 6개국 비교</h3><div class="small">경쟁가를 입력하지 않은 국가는 목표 마진 기준 권장가를 보여줘.</div><div id="comparison" class="scroll" style="margin-top:10px"></div></section><section id="db" class="hidden"><div class="top"><h3>상품 DB</h3><div class="actions"><button class="btn gray" onclick="exportDB()">백업 JSON</button><label class="btn gray">백업 복원<input type="file" accept="application/json" onchange="importDB(this)" hidden></label></div></div><div class="small">상품 원가·중량·크기·마진·국가·경쟁가까지 브라우저에 저장돼.</div><div id="dbtable" class="scroll" style="margin-top:12px"></div></section></div><div class="card"><div class="small">수수료/SLS는 DATA 버전, 환율은 FX 버전을 별도로 표시해. 최신 공식 Shopee 요금은 Seller Centre/SEH를 최종 기준으로 확인해야 해.</div></div></div><script>let data,cfg,fxmeta,last;const $=id=>document.getElementById(id),n=id=>+$(id).value||0;function tab(id,b){['calc','compare','db'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function load(){data=await(await fetch('./data.json?'+Date.now())).json();cfg=structuredClone(data.markets);$('dv').textContent='DATA '+data.dataVersion;await refreshFX();calc()}function ship(c,g,w,d,h){let s=data.markets[c].sls,cg=c==='말레이시아'?Math.max(g,w*d*h/6000*1000):g;if(s.kind==='step50')return Math.max(0,s.base+s.step*Math.ceil(cg/50));return cg<=500?s.lowBase+s.lowStep*Math.ceil(cg/100):s.highBase+s.highStep*Math.ceil((cg-500)/250)}async function refreshFX(){try{let r=await fetch('./fx.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let f=await r.json();for(let c in cfg){let code=cfg[c].cur;if(f.jpyPer[code])cfg[c].jpyPer=f.jpyPer[code]}fxmeta=f;localStorage.setItem('japanova_fx_snapshot',JSON.stringify(f));$('fv').textContent='FX '+f.fxVersion;$('fxstatus').textContent='JAPANOVA 환율 데이터 정상 · 기준 '+new Date(f.updatedAt).toLocaleString()}catch(e){let f=JSON.parse(localStorage.getItem('japanova_fx_snapshot')||'null');if(f){for(let c in cfg){let code=cfg[c].cur;if(f.jpyPer[code])cfg[c].jpyPer=f.jpyPer[code]}fxmeta=f;$('fv').textContent='FX CACHE';$('fxstatus').textContent='환율 데이터 연결 불가 · 마지막 저장 스냅샷 사용'}else{$('fv').textContent='FX DEFAULT';$('fxstatus').textContent='환율 데이터 연결 불가 · 기본 환율 사용'}}showFX();calc()}function showFX(){$('fx').textContent=Object.values(cfg).map(x=>x.cur+' 1 = ¥'+x.jpyPer.toFixed(x.jpyPer<.1?5:3)).join(' | ')}function core(c,actual=0){let x=cfg[c],base=n('cost')+n('domestic')+n('packing'),sl=ship(c,n('weight'),n('w'),n('d'),n('h')),jp=x.jpyPer*(1+n('buffer')/100),sj=sl*jp,m=n('margin')/100,fixed=x.fixed*jp,baseRate=x.commission+x.payment+n('discount')/100+n('extra')/100+n('payoneer')/100;function fees(p){let local=p/jp,fee=p*baseRate;if(c==='필리핀')fee+=Math.min(local*x.ccb,100)*jp+Math.min(local*x.mdv,200)*jp+Math.min(local*x.pf,100)*jp;else fee+=p*(x.ccb+x.mdv+x.pf);return fee}let p=(base+sj+fixed)/(1-baseRate-(c==='필리핀'?x.ccb+x.mdv+x.pf:0)-m);for(let i=0;i<12;i++)p=base+sj+fixed+fees(p)+m*p;let used=actual>0?actual*jp:p,f=fees(used),profit=used-base-sj-fixed-f,pm=used?profit/used:0;return{c,x,base,sl,jp,sj,fixed,p,local:p/jp,used,fees:f,profit,pm,feeFn:fees}}function calc(){if(!cfg)return;last=core($('country').value,n('actual'));let r=last,rf=r.feeFn(r.p),rp=r.p-r.base-r.sj-r.fixed-rf,actual=n('actual')>0?`<div class="metric"><b>경쟁/실판매가 순이익</b><span>¥${Math.round(r.profit).toLocaleString()}</span></div><div class="metric"><b>경쟁/실판매 마진</b><span>${(r.pm*100).toFixed(1)}%</span></div>`:'';$('results').innerHTML=`<div class="metric"><b>SLS 국제배송</b><span>${r.sl.toLocaleString(undefined,{maximumFractionDigits:2})} ${r.x.cur}</span></div><div class="metric"><b>권장 등록가</b><span>${Math.ceil(r.local).toLocaleString()} ${r.x.cur}</span></div><div class="metric"><b>JPY 판매가</b><span>¥${Math.round(r.p).toLocaleString()}</span></div><div class="metric"><b>목표가 예상 순이익</b><span>¥${Math.round(rp).toLocaleString()}</span></div>${actual}`;if(n('actual')>0){let cls=r.pm>=n('margin')/100?'good':r.pm>=.1?'warn':'bad',txt=r.pm>=n('margin')/100?'판매 후보: 목표 마진 충족':r.pm>=.1?'주의: 이익은 나지만 목표 마진 미달':'보류: 마진이 너무 낮음';$('verdict').innerHTML=`<b class="${cls}">${txt} · ${(r.pm*100).toFixed(1)}%</b>`}else $('verdict').innerHTML='';$('detail').innerHTML=`<table><tr><th>항목</th><th>값</th></tr><tr><td>상품+국내배송+포장</td><td>¥${r.base.toLocaleString()}</td></tr><tr><td>SLS JPY 환산</td><td>¥${Math.round(r.sj).toLocaleString()}</td></tr><tr><td>목표가 수수료 예상</td><td>¥${Math.round(rf).toLocaleString()}</td></tr><tr><td>수수료/SLS 데이터</td><td>${data.dataVersion}</td></tr><tr><td>환율 데이터</td><td>${fxmeta?fxmeta.fxVersion:'기본값'}</td></tr></table>`}function compare(){if(!cfg)return;let rows=Object.keys(cfg).map(c=>{let r=core(c),f=r.feeFn(r.p),profit=r.p-r.base-r.sj-r.fixed-f;return`<tr><td>${c}</td><td>${r.x.cur}</td><td>${r.sl.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td class="good">${Math.ceil(r.local).toLocaleString()}</td><td>¥${Math.round(r.p).toLocaleString()}</td><td>¥${Math.round(profit).toLocaleString()}</td><td>${(profit/r.p*100).toFixed(1)}%</td></tr>`}).join('');$('comparison').innerHTML=`<table><tr><th>국가</th><th>통화</th><th>SLS</th><th>권장 등록가</th><th>JPY 환산</th><th>순이익</th><th>마진</th></tr>${rows}</table>`}function snapshot(){return{name:$('name').value||'상품',country:$('country').value,cost:n('cost'),domestic:n('domestic'),packing:n('packing'),weight:n('weight'),w:n('w'),d:n('d'),h:n('h'),margin:n('margin'),actual:n('actual'),discount:n('discount'),extra:n('extra'),payoneer:n('payoneer'),buffer:n('buffer'),saved:new Date().toLocaleString()}}function saveProduct(){let db=JSON.parse(localStorage.getItem('japanova_products')||'[]');db.unshift(snapshot());localStorage.setItem('japanova_products',JSON.stringify(db));alert('상품 DB에 저장했어.')}function renderDB(){let db=JSON.parse(localStorage.getItem('japanova_products')||'[]');$('dbtable').innerHTML=db.length?`<table><tr><th>상품명</th><th>국가</th><th>매입가</th><th>중량</th><th>경쟁가</th><th>저장일</th><th></th></tr>${db.map((p,i)=>`<tr><td>${p.name}</td><td>${p.country||'-'}</td><td>¥${p.cost}</td><td>${p.weight}g</td><td>${p.actual||'-'}</td><td>${p.saved}</td><td><button onclick="loadP(${i})">불러오기</button> <button onclick="delP(${i})">삭제</button></td></tr>`).join('')}</table>`:'저장된 상품이 없어.'}function loadP(i){let p=JSON.parse(localStorage.getItem('japanova_products')||'[]')[i];['name','cost','domestic','packing','weight','w','d','h','margin','actual','discount','extra','payoneer','buffer'].forEach(k=>{if(p[k]!=null)$(k).value=p[k]});if(p.country)$('country').value=p.country;document.querySelector('.tab').click();calc()}function delP(i){let db=JSON.parse(localStorage.getItem('japanova_products')||'[]');db.splice(i,1);localStorage.setItem('japanova_products',JSON.stringify(db));renderDB()}function exportDB(){let s=localStorage.getItem('japanova_products')||'[]',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='JAPANOVA_products_backup.json';a.click()}function importDB(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw Error();localStorage.setItem('japanova_products',JSON.stringify(d));renderDB();alert('상품 DB 복원 완료')}catch(e){alert('올바른 JAPANOVA 백업 파일이 아니야.')}};r.readAsText(f)}load()</script></body></html>
