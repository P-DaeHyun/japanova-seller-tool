<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA Seller Tool V3</title><style>:root{--n:#17365d;--bg:#f5f7fb;--ln:#d8dee9;--g:#087a55;--r:#b42318;--a:#b54708}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:#182230}.wrap{max-width:1240px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.top,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.actions{justify-content:flex-start}.badge{padding:6px 10px;border-radius:999px;background:#eaf1fa;font-weight:700;font-size:12px}.grid,.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--n);color:#fff;font-weight:700;cursor:pointer}.gray{background:#667085}.green{background:var(--g)}.small{font-size:12px;color:#667085}.metric{background:#f3f7fc;padding:13px;border-radius:12px}.metric b{display:block;font-size:12px;margin-bottom:6px}.metric span{font-size:20px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:13px}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eef5;color:var(--n)}.tab.active{background:var(--n);color:#fff}.hidden{display:none}.good{font-weight:800;color:var(--g)}.bad{font-weight:800;color:var(--r)}.warn{font-weight:800;color:var(--a)}.winner{background:#ecfdf3}.decision{padding:14px;border-radius:12px;background:#f8fafc;margin-top:12px;font-size:16px}.score{font-size:28px;font-weight:900}</style></head><body><div class="wrap"><div class="card top"><div><h1>JAPANOVA Seller Tool V3</h1><div class="small">Shopee 상품 발굴 · 6개국 수익성 · 경쟁가 · 우선시장 · 상품 DB</div></div><div><span class="badge">APP 3.0.0</span> <span id="dv" class="badge"></span> <span id="fv" class="badge"></span></div></div><div class="card"><div class="top"><b>데이터 업데이트 센터</b><button class="btn" onclick="refreshFX()">환율 데이터 확인</button></div><div id="fx" class="small" style="margin-top:10px"></div><div id="fxstatus" class="small" style="margin-top:7px;font-weight:700"></div></div><div class="card"><div class="tabs"><button class="btn tab active" onclick="tab('decision',this);analyze()">상품 판단</button><button class="btn tab" onclick="tab('calc',this);calc()">국가별 계산</button><button class="btn tab" onclick="tab('db',this);renderDB()">상품 DB</button></div><h3>상품 기본정보</h3><div class="grid"><div class="field"><label>상품명</label><input id="name" value="테스트 상품" oninput="analyze()"></div><div class="field"><label>매입가 JPY</label><input id="cost" type="number" value="1000" oninput="analyze()"></div><div class="field"><label>일본 국내배송 배분 JPY</label><input id="domestic" type="number" value="300" oninput="analyze()"></div><div class="field"><label>포장비/기타 JPY</label><input id="packing" type="number" value="50" oninput="analyze()"></div><div class="field"><label>포장 완료 중량 g</label><input id="weight" type="number" value="200" oninput="analyze()"></div><div class="field"><label>가로 cm</label><input id="w" type="number" value="20" oninput="analyze()"></div><div class="field"><label>세로 cm</label><input id="d" type="number" value="15" oninput="analyze()"></div><div class="field"><label>높이 cm</label><input id="h" type="number" value="5" oninput="analyze()"></div><div class="field"><label>목표 순이익률 %</label><input id="margin" type="number" value="20" oninput="analyze()"></div><div class="field"><label>Payoneer %</label><input id="payoneer" type="number" value="2" oninput="analyze()"></div><div class="field"><label>환율 변동 대비 %</label><input id="buffer" type="number" value="1" oninput="analyze()"></div></div><section id="decision"><h3 style="margin-top:22px">6개국 경쟁가격 입력 <span class="small">모르면 0으로 두면 돼</span></h3><div id="competitors" class="grid"></div><div class="top" style="margin-top:16px"><h3>JAPANOVA 상품 판단</h3><button class="btn green" onclick="saveProduct()">분석 결과 저장</button></div><div id="summary" class="results"></div><div id="decisionText" class="decision"></div><div id="marketTable" class="scroll" style="margin-top:12px"></div></section><section id="calc" class="hidden"><h3 style="margin-top:22px">국가별 상세 계산</h3><div class="grid"><div class="field"><label>판매국</label><select id="country" onchange="calc()"></select></div><div class="field"><label>실제 판매가 (현지통화)</label><input id="actual" type="number" value="0" oninput="calc()"></div><div class="field"><label>추가 할인/프로모션 %</label><input id="discount" type="number" value="0" oninput="calc()"></div><div class="field"><label>추가 서비스 수수료 %</label><input id="extra" type="number" value="0" oninput="calc()"></div></div><div id="results" class="results" style="margin-top:16px"></div><div id="verdict" class="decision"></div></section><section id="db" class="hidden"><div class="top" style="margin-top:20px"><h3>상품 DB</h3><div class="actions"><button class="btn gray" onclick="exportDB()">백업 JSON</button><label class="btn gray">백업 복원<input type="file" accept="application/json" onchange="importDB(this)" hidden></label></div></div><div id="dbtable" class="scroll"></div></section></div><div class="card small">판단 점수는 수익성·경쟁가격 적합도·배송 효율을 기반으로 한 JAPANOVA 내부 의사결정 보조지표야. 실제 수요·경쟁강도·규제는 상품 리서치와 함께 최종 판단해야 해.</div></div><script>let data,cfg,fxmeta,markets=[];const $=x=>document.getElementById(x),n=x=>+$(x).value||0;function tab(id,b){['decision','calc','db'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function load(){data=await(await fetch('./data.json?'+Date.now())).json();cfg=structuredClone(data.markets);markets=Object.keys(cfg);$('dv').textContent='DATA '+data.dataVersion;$('country').innerHTML=markets.map(c=>`<option>${c}</option>`).join('');$('competitors').innerHTML=markets.map(c=>`<div class="field"><label>${c} 경쟁가 (${cfg[c].cur})</label><input id="cp_${c}" type="number" value="0" oninput="analyze()"></div>`).join('');await refreshFX();analyze()}async function refreshFX(){try{let r=await fetch('./fx.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;let f=await r.json();markets.forEach(c=>{let code=cfg[c].cur;if(f.jpyPer[code])cfg[c].jpyPer=f.jpyPer[code]});fxmeta=f;localStorage.setItem('japanova_fx_snapshot',JSON.stringify(f));$('fv').textContent='FX '+f.fxVersion;$('fxstatus').textContent='환율 데이터 정상 · '+new Date(f.updatedAt).toLocaleString()}catch(e){let f=JSON.parse(localStorage.getItem('japanova_fx_snapshot')||'null');if(f){markets.forEach(c=>{let code=cfg[c].cur;if(f.jpyPer[code])cfg[c].jpyPer=f.jpyPer[code]});fxmeta=f;$('fv').textContent='FX CACHE';$('fxstatus').textContent='마지막 저장 환율 사용'}else{$('fv').textContent='FX DEFAULT';$('fxstatus').textContent='기본 환율 사용'}}showFX();analyze()}function showFX(){$('fx').textContent=markets.map(c=>cfg[c].cur+' 1 = ¥'+cfg[c].jpyPer.toFixed(cfg[c].jpyPer<.1?5:3)).join(' | ')}function ship(c){let s=data.markets[c].sls,g=n('weight'),cg=c==='말레이시아'?Math.max(g,n('w')*n('d')*n('h')/6000*1000):g;if(s.kind==='step50')return Math.max(0,s.base+s.step*Math.ceil(cg/50));return cg<=500?s.lowBase+s.lowStep*Math.ceil(cg/100):s.highBase+s.highStep*Math.ceil((cg-500)/250)}function core(c,actual=0,disc=0,extra=0){let x=cfg[c],base=n('cost')+n('domestic')+n('packing'),jp=x.jpyPer*(1+n('buffer')/100),sl=ship(c),sj=sl*jp,fixed=x.fixed*jp,m=n('margin')/100,br=x.commission+x.payment+n('payoneer')/100+disc/100+extra/100;function fees(p){let loc=p/jp,f=p*br;if(c==='필리핀')f+=(Math.min(loc*x.ccb,100)+Math.min(loc*x.mdv,200)+Math.min(loc*x.pf,100))*jp;else f+=p*(x.ccb+x.mdv+x.pf);return f}let p=(base+sj+fixed)/(1-br-(c==='필리핀'?x.ccb+x.mdv+x.pf:0)-m);for(let i=0;i<14;i++)p=base+sj+fixed+fees(p)+m*p;let used=actual>0?actual*jp:p,fee=fees(used),profit=used-base-sj-fixed-fee;return{c,x,jp,sl,sj,base,p,local:p/jp,used,fee,profit,pm:used?profit/used:0}}function analyze(){if(!cfg)return;let rows=markets.map(c=>{let cp=+$('cp_'+c).value||0,r=core(c,cp),target=core(c),has=cp>0,fit=has?Math.min(100,Math.max(0,(r.pm/.20)*70+(cp>=target.local?30:15))):50,shipScore=Math.max(0,100-n('weight')/10),score=Math.round(fit*.7+shipScore*.3),status=!has?'가격조사 필요':r.pm>=n('margin')/100?'판매 후보':r.pm>=.10?'주의':'보류';return{c,cp,r,target,score,status}});let ranked=[...rows].sort((a,b)=>b.score-a.score),best=ranked[0],valid=rows.filter(x=>x.cp>0),avg=valid.length?valid.reduce((s,x)=>s+x.score,0)/valid.length:0,grade=avg>=85?'SS':avg>=75?'S':avg>=65?'A':valid.length?'B':'미평가';$('summary').innerHTML=`<div class="metric"><b>JAPANOVA 등급</b><span>${grade}</span></div><div class="metric"><b>우선 검토 시장</b><span>${best.c}</span></div><div class="metric"><b>입력된 경쟁시장</b><span>${valid.length}/6</span></div><div class="metric"><b>포장중량</b><span>${n('weight')}g</span></div>`;$('decisionText').innerHTML=valid.length?`<b>${$('name').value}</b> 분석 결과: 현재 입력값 기준 <b>${best.c}</b>를 우선 검토해. 경쟁가격이 입력된 시장의 평균 판단점수는 <span class="score">${Math.round(avg)}</span>/100이야.`:`경쟁가격을 하나 이상 입력하면 실제 가격에서 마진을 계산해서 우선 판매국과 판매 가능성을 판단해줄게.`;$('marketTable').innerHTML=`<table><tr><th>국가</th><th>경쟁가</th><th>목표 권장가</th><th>경쟁가 마진</th><th>순이익 JPY</th><th>판단</th><th>점수</th></tr>${ranked.map((x,i)=>`<tr class="${i===0?'winner':''}"><td>${x.c}</td><td>${x.cp?x.cp.toLocaleString()+' '+x.r.x.cur:'-'}</td><td>${Math.ceil(x.target.local).toLocaleString()} ${x.r.x.cur}</td><td>${x.cp?(x.r.pm*100).toFixed(1)+'%':'-'}</td><td>${x.cp?'¥'+Math.round(x.r.profit).toLocaleString():'-'}</td><td class="${x.status==='판매 후보'?'good':x.status==='보류'?'bad':'warn'}">${x.status}</td><td>${x.cp?x.score:'-'}</td></tr>`).join('')}</table>`}function calc(){if(!cfg)return;let r=core($('country').value,n('actual'),n('discount'),n('extra')),target=core($('country').value,0,n('discount'),n('extra')),tf=target.fee,actual=n('actual')>0;$('results').innerHTML=`<div class="metric"><b>SLS</b><span>${r.sl.toFixed(2)} ${r.x.cur}</span></div><div class="metric"><b>권장 등록가</b><span>${Math.ceil(target.local).toLocaleString()} ${r.x.cur}</span></div><div class="metric"><b>${actual?'실판매 순이익':'목표 순이익'}</b><span>¥${Math.round(actual?r.profit:target.profit).toLocaleString()}</span></div><div class="metric"><b>순이익률</b><span>${((actual?r.pm:target.pm)*100).toFixed(1)}%</span></div>`;$('verdict').innerHTML=actual?(r.pm>=n('margin')/100?'<b class="good">판매 후보 · 목표 마진 충족</b>':r.pm>=.1?'<b class="warn">주의 · 이익은 있지만 목표 마진 미달</b>':'<b class="bad">보류 · 마진 부족</b>'):'실제 판매가를 입력하면 판매 가능성을 판정해.'}function snapshot(){let cp={};markets.forEach(c=>cp[c]=+$('cp_'+c).value||0);return{name:$('name').value,cost:n('cost'),domestic:n('domestic'),packing:n('packing'),weight:n('weight'),w:n('w'),d:n('d'),h:n('h'),margin:n('margin'),payoneer:n('payoneer'),buffer:n('buffer'),competitors:cp,saved:new Date().toLocaleString()}}function saveProduct(){let db=JSON.parse(localStorage.getItem('japanova_products_v3')||'[]');db.unshift(snapshot());localStorage.setItem('japanova_products_v3',JSON.stringify(db));alert('V3 상품 DB에 저장했어.')}function renderDB(){let db=JSON.parse(localStorage.getItem('japanova_products_v3')||'[]');$('dbtable').innerHTML=db.length?`<table><tr><th>상품명</th><th>매입가</th><th>중량</th><th>저장일</th><th></th></tr>${db.map((p,i)=>`<tr><td>${p.name}</td><td>¥${p.cost}</td><td>${p.weight}g</td><td>${p.saved}</td><td><button onclick="loadP(${i})">불러오기</button> <button onclick="delP(${i})">삭제</button></td></tr>`).join('')}</table>`:'저장된 V3 상품이 없어.'}function loadP(i){let p=JSON.parse(localStorage.getItem('japanova_products_v3')||'[]')[i];['name','cost','domestic','packing','weight','w','d','h','margin','payoneer','buffer'].forEach(k=>$(k).value=p[k]);markets.forEach(c=>$('cp_'+c).value=p.competitors?.[c]||0);document.querySelector('.tab').click();analyze()}function delP(i){let db=JSON.parse(localStorage.getItem('japanova_products_v3')||'[]');db.splice(i,1);localStorage.setItem('japanova_products_v3',JSON.stringify(db));renderDB()}function exportDB(){let s=localStorage.getItem('japanova_products_v3')||'[]',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='JAPANOVA_V3_products.json';a.click()}function importDB(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;localStorage.setItem('japanova_products_v3',JSON.stringify(d));renderDB();alert('V3 상품 DB 복원 완료')}catch(e){alert('올바른 백업 파일이 아니야.')}};r.readAsText(f)}load()</script></body></html>
