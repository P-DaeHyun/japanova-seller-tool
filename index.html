<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA Seller Tool V2.1</title><style>:root{--navy:#17365d;--bg:#f5f7fb;--line:#d8dee9;--green:#087a55}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:#182230}.wrap{max-width:1220px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#eaf1fa;font-weight:700;font-size:12px}.grid,.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}.btn.green{background:var(--green)}.btn.gray{background:#667085}.small{font-size:12px;color:#667085}.metric{background:#f3f7fc;padding:13px;border-radius:12px}.metric b{display:block;font-size:12px;margin-bottom:6px}.metric span{font-size:20px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:13px}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#e9eef5;color:#17365d}.tab.active{background:#17365d;color:#fff}.hidden{display:none}.good{font-weight:800;color:#087a55}</style></head><body><div class="wrap"><div class="card top"><div><h1>JAPANOVA Seller Tool V2.1</h1><div class="small">Shopee 6개국 마진 · SLS · 상품DB · 역산 · 6개국 비교</div></div><div><span class="badge">APP 2.1.0</span> <span id="dv" class="badge"></span></div></div><div class="card"><div class="top"><b>자동 업데이트 센터</b><button class="btn" onclick="refreshFX()">환율 새로고침</button></div><div id="fx" class="small" style="margin-top:10px"></div></div><div class="card"><div class="tabs"><button class="btn tab active" onclick="tab('calc',this)">마진 계산</button><button class="btn tab" onclick="tab('compare',this);compare()">6개국 비교</button><button class="btn tab" onclick="tab('db',this);renderDB()">상품 DB</button></div><section id="calc"><h3>상품 입력</h3><div class="grid"><div class="field"><label>상품명</label><input id="name" value="테스트 상품"></div><div class="field"><label>판매국</label><select id="country" onchange="calc()"><option>대만</option><option>싱가포르</option><option>말레이시아</option><option>태국</option><option>필리핀</option><option>베트남</option></select></div><div class="field"><label>상품 매입가 JPY</label><input id="cost" type="number" value="1000" oninput="calc()"></div><div class="field"><label>일본 국내배송 배분 JPY</label><input id="domestic" type="number" value="300" oninput="calc()"></div><div class="field"><label>포장비/기타 JPY</label><input id="packing" type="number" value="50" oninput="calc()"></div><div class="field"><label>포장 완료 실중량 g</label><input id="weight" type="number" value="200" oninput="calc()"></div><div class="field"><label>가로 cm</label><input id="w" type="number" value="20" oninput="calc()"></div><div class="field"><label>세로 cm</label><input id="d" type="number" value="15" oninput="calc()"></div><div class="field"><label>높이 cm</label><input id="h" type="number" value="5" oninput="calc()"></div><div class="field"><label>목표 순이익률 %</label><input id="margin" type="number" value="20" oninput="calc()"></div><div class="field"><label>추가 할인/프로모션 %</label><input id="discount" type="number" value="0" oninput="calc()"></div><div class="field"><label>추가 서비스 수수료 %</label><input id="extra" type="number" value="0" oninput="calc()"></div><div class="field"><label>Payoneer %</label><input id="payoneer" type="number" value="2" oninput="calc()"></div><div class="field"><label>환율 안전마진 %</label><input id="buffer" type="number" value="2" oninput="calc()"></div><div class="field"><label>실제 판매가 (현지통화, 선택)</label><input id="actual" type="number" value="0" oninput="calc()"></div></div><div class="top" style="margin-top:14px"><h3>계산 결과</h3><button class="btn green" onclick="saveProduct()">상품 저장</button></div><div id="results" class="results"></div><div id="detail" class="scroll" style="margin-top:14px"></div></section><section id="compare" class="hidden"><h3>현재 상품 6개국 비교</h3><div id="comparison" class="scroll"></div></section><section id="db" class="hidden"><div class="top"><h3>상품 DB</h3><button class="btn gray" onclick="exportDB()">백업 JSON</button></div><div class="small">브라우저에 저장돼. 상품을 불러오면 입력값이 복원돼.</div><div id="dbtable" class="scroll" style="margin-top:12px"></div></section></div><div class="card"><div class="small">SLS/수수료 데이터는 data.json에서 관리. 최신 공식 SLS/수수료는 Seller Centre/SEH를 최종 기준으로 확인해야 해.</div></div></div><script>let data,cfg,last;const $=id=>document.getElementById(id),n=id=>+$(id).value||0;function tab(id,b){['calc','compare','db'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function load(){data=await(await fetch('./data.json?'+Date.now())).json();cfg=structuredClone(data.markets);let saved=JSON.parse(localStorage.getItem('japanova_fx')||'null');if(saved)for(let c in cfg)if(saved[c])cfg[c].jpyPer=saved[c];$('dv').textContent='DATA '+data.dataVersion;showFX();calc();refreshFX()}function ship(c,g,w,d,h){let s=data.markets[c].sls,cg=c==='말레이시아'?Math.max(g,w*d*h/6000*1000):g;if(s.kind==='step50')return Math.max(0,s.base+s.step*Math.ceil(cg/50));return cg<=500?s.lowBase+s.lowStep*Math.ceil(cg/100):s.highBase+s.highStep*Math.ceil((cg-500)/250)}async function refreshFX(){try{let j=await(await fetch('https://api.frankfurter.app/latest?from=JPY&to=TWD,SGD,MYR,THB,PHP,VND')).json(),save={};for(let c in cfg){let code=cfg[c].cur;if(j.rates[code])cfg[c].jpyPer=1/j.rates[code];save[c]=cfg[c].jpyPer}localStorage.setItem('japanova_fx',JSON.stringify(save));showFX();calc()}catch(e){$('fx').textContent+=' · 환율 서버 연결 실패: 저장값 사용'}}function showFX(){$('fx').textContent=Object.values(cfg).map(x=>x.cur+' 1 = ¥'+x.jpyPer.toFixed(x.jpyPer<.1?5:3)).join(' | ')}function core(c,actual=0){let x=cfg[c],base=n('cost')+n('domestic')+n('packing'),sl=ship(c,n('weight'),n('w'),n('d'),n('h')),jp=x.jpyPer*(1+n('buffer')/100),sj=sl*jp,m=n('margin')/100,fixed=x.fixed*jp,baseRate=x.commission+x.payment+n('discount')/100+n('extra')/100+n('payoneer')/100;function varFees(p){let local=p/jp,fee=p*baseRate;if(c==='필리핀'){fee+=Math.min(local*x.ccb,100)*jp+Math.min(local*x.mdv,200)*jp+Math.min(local*x.pf,100)*jp}else fee+=p*(x.ccb+x.mdv+x.pf);return fee}let p=(base+sj+fixed)/(1-baseRate-(c==='필리핀'?x.ccb+x.mdv+x.pf:0)-m);for(let i=0;i<8;i++)p=(base+sj+fixed+varFees(p)+m*p);let used=actual>0?actual*jp:p,fees=varFees(used),profit=used-base-sj-fixed-fees,pm=used?profit/used:0;return{c,x,base,sl,jp,sj,fixed,p,local:p/jp,used,fees,profit,pm}}function calc(){if(!cfg)return;last=core($('country').value,n('actual'));let r=last;let actual=n('actual')>0?`<div class="metric"><b>실판매가 기준 순이익</b><span>¥${Math.round(r.profit).toLocaleString()}</span></div><div class="metric"><b>실판매 순이익률</b><span>${(r.pm*100).toFixed(1)}%</span></div>`:'';$('results').innerHTML=`<div class="metric"><b>SLS 국제배송</b><span>${r.sl.toLocaleString(undefined,{maximumFractionDigits:2})} ${r.x.cur}</span></div><div class="metric"><b>권장 등록가</b><span>${Math.ceil(r.local).toLocaleString()} ${r.x.cur}</span></div><div class="metric"><b>JPY 판매가</b><span>¥${Math.round(r.p).toLocaleString()}</span></div><div class="metric"><b>예상 순이익</b><span>¥${Math.round((r.p-r.base-r.sj-r.fixed-(core(r.c).fees))).toLocaleString()}</span></div>${actual}`;$('detail').innerHTML=`<table><tr><th>항목</th><th>값</th></tr><tr><td>상품+국내배송+포장</td><td>¥${r.base.toLocaleString()}</td></tr><tr><td>SLS JPY 환산</td><td>¥${Math.round(r.sj).toLocaleString()}</td></tr><tr><td>수수료 예상</td><td>¥${Math.round(r.fees).toLocaleString()}</td></tr><tr><td>데이터 기준</td><td>${data.dataVersion}</td></tr></table>`}function compare(){if(!cfg)return;let rows=Object.keys(cfg).map(c=>{let r=core(c);return`<tr><td>${c}</td><td>${r.x.cur}</td><td>${r.sl.toLocaleString(undefined,{maximumFractionDigits:2})}</td><td class="good">${Math.ceil(r.local).toLocaleString()}</td><td>¥${Math.round(r.p).toLocaleString()}</td><td>¥${Math.round(r.p-r.base-r.sj-r.fixed-r.fees).toLocaleString()}</td></tr>`}).join('');$('comparison').innerHTML=`<table><tr><th>국가</th><th>통화</th><th>SLS</th><th>권장 등록가</th><th>JPY 환산</th><th>예상 순이익</th></tr>${rows}</table>`}function snapshot(){return{name:$('name').value||'상품',cost:n('cost'),domestic:n('domestic'),packing:n('packing'),weight:n('weight'),w:n('w'),d:n('d'),h:n('h'),margin:n('margin'),saved:new Date().toLocaleString()}}function saveProduct(){let db=JSON.parse(localStorage.getItem('japanova_products')||'[]');db.unshift(snapshot());localStorage.setItem('japanova_products',JSON.stringify(db));alert('상품 DB에 저장했어.')}function renderDB(){let db=JSON.parse(localStorage.getItem('japanova_products')||'[]');$('dbtable').innerHTML=db.length?`<table><tr><th>상품명</th><th>매입가</th><th>중량</th><th>저장일</th><th></th></tr>${db.map((p,i)=>`<tr><td>${p.name}</td><td>¥${p.cost}</td><td>${p.weight}g</td><td>${p.saved}</td><td><button onclick="loadP(${i})">불러오기</button> <button onclick="delP(${i})">삭제</button></td></tr>`).join('')}</table>`:'저장된 상품이 없어.'}function loadP(i){let p=JSON.parse(localStorage.getItem('japanova_products')||'[]')[i];['name','cost','domestic','packing','weight','w','d','h','margin'].forEach(k=>$(k).value=p[k]);document.querySelector('.tab').click();calc()}function delP(i){let db=JSON.parse(localStorage.getItem('japanova_products')||'[]');db.splice(i,1);localStorage.setItem('japanova_products',JSON.stringify(db));renderDB()}function exportDB(){let s=localStorage.getItem('japanova_products')||'[]',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='JAPANOVA_products_backup.json';a.click()}load()</script></body></html>
