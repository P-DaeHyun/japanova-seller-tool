<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>JAPANOVA Shopee Sandbox Callback</title>
  <style>
    body{margin:0;background:#0b0f14;color:#f4f7fb;font-family:Arial,"Noto Sans KR",sans-serif}
    .wrap{max-width:760px;margin:60px auto;padding:24px}
    .card{background:#121820;border:1px solid #26303d;border-radius:16px;padding:24px}
    h1{font-size:22px;margin:0 0 10px}.muted{color:#94a1b2;line-height:1.6}.row{margin-top:18px}.label{font-size:12px;color:#94a1b2;margin-bottom:6px}.value{background:#0a0e13;border:1px solid #2b3645;border-radius:10px;padding:12px;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.warn{margin-top:18px;padding:12px;border-radius:10px;background:#2a2112;border:1px solid #5a4720;color:#ffd98a;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Shopee Sandbox Authorization Callback</h1>
  <div class="muted">Shopee Sandbox 인증 결과를 브라우저에서 확인하기 위한 JAPANOVA 테스트 페이지야. 이 페이지는 전달받은 값을 외부로 전송하거나 저장하지 않아.</div>
  <div class="row"><div class="label">code</div><div id="code" class="value">-</div></div>
  <div class="row"><div class="label">shop_id</div><div id="shop" class="value">-</div></div>
  <div class="row"><div class="label">main_account_id</div><div id="main" class="value">-</div></div>
  <div class="row"><div class="label">state</div><div id="state" class="value">-</div></div>
  <div class="warn">Sandbox 전용 임시 콜백 페이지야. Production에서는 Partner Key, access token, refresh token을 브라우저나 GitHub Pages에 저장하지 않고 서버 측에서 처리해야 해.</div>
</div></div>
<script>
  const q=new URLSearchParams(location.search);
  document.getElementById('code').textContent=q.get('code')||'-';
  document.getElementById('shop').textContent=q.get('shop_id')||'-';
  document.getElementById('main').textContent=q.get('main_account_id')||'-';
  document.getElementById('state').textContent=q.get('state')||'-';
</script>
</body>
</html>
