name: Check JAPANOVA Seller OS

on:
  push:
    branches: [main]
    paths:
      - 'seller-os/**'
      - 'render.yaml'
      - '.github/workflows/seller-os-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller-os/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check backend syntax
        run: |
          node --check src/server.js
          node --check src/bootstrapSync.js
          node --check src/config.js
          node --check src/db.js
          node --check src/tokenCrypto.js
          node --check src/migrate.js
          node --check src/services/fx.js
          node --check src/services/shopee.js
          node --check src/services/sync.js

      - name: Check stable frontend JavaScript syntax
        run: node --check ../app.js

      - name: Check v0.4 preview inline JavaScript syntax
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('../v04.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('v04.html에서 <script>를 찾지 못했습니다.');
          fs.writeFileSync('/tmp/japanova-v04-inline.js', scripts.map((m) => m[1]).join('\n'));
          NODE
          node --check /tmp/japanova-v04-inline.js
