name: Check JAPANOVA Seller OS

on:
  push:
    branches: [main]
    paths:
      - 'seller-os/**'
      - 'render.yaml'
      - '.github/workflows/seller-os-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller-os/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check backend syntax
        run: |
          node --check src/server.js
          node --check src/bootstrapSync.js
          node --check src/config.js
          node --check src/db.js
          node --check src/tokenCrypto.js
          node --check src/migrate.js
          node --check src/services/fx.js
          node --check src/services/shopee.js
          node --check src/services/sync.js
          node --check src/services/inventory.js
          node --check src/services/candidates.js
          node --check src/services/marketResearch.js
          node --check src/routes/candidates.js
          node --check src/routes/research.js
          test -f ../db/candidates.sql
          grep -q '"version": "2.2.0"' package.json
          grep -q 'multer' package.json

      - name: Check stable frontend JavaScript syntax
        run: |
          node --check ../app.js
          node --check ../candidate-lab.js
          node --check ../candidate-lab-v10.js
          node --check ../competitor-research.js
          node --check ../listing-prep.js
          node --check ../listing-prep-v13.js
          node --check ../listing-prep-v14.js
          node --check ../listing-prep-v15.js
          node --check ../listing-prep-v16.js
          node --check ../listing-prep-v17.js
          node --check ../listing-prep-v18.js
          node --check ../listing-prep-v19.js
          node --check ../listing-prep-v20.js
          node --check ../listing-prep-v21.js
          node --check ../listing-prep-v22.js
          node --check ../sourcing-v2.js
          node --check ../sourcing-v1.js

      - name: Check preview inline JavaScript syntax
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['../v04.html', '../v05.html', '../v06.html', '../v07.html', '../v08.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            if (!scripts.length) throw new Error(`${file}에서 <script>를 찾지 못했습니다.`);
            const out = `/tmp/${file.split('/').pop().replace('.html','')}-inline.js`;
            fs.writeFileSync(out, scripts.map((m) => m[1]).join('\n'));
            console.log(out);
          }
          NODE
          node --check /tmp/v04-inline.js
          node --check /tmp/v05-inline.js
          node --check /tmp/v06-inline.js
          node --check /tmp/v07-inline.js
          node --check /tmp/v08-inline.js

      - name: Check pre-listing document references
        run: |
          test -f ../v09.html
          grep -q 'candidate-lab.js' ../v09.html
          grep -q 'margin-engine.js' ../v09.html
          test -f ../v10.html
          grep -q 'candidate-lab-v10.js' ../v10.html
          grep -q 'margin-engine.js' ../v10.html
          grep -q '최대 매입가능가' ../v10.html
          grep -q '후보상품 비교판' ../v10.html
          test -f ../v11.html
          grep -q 'competitor-research.js' ../v11.html
          grep -q '경쟁상품 조사센터' ../v11.html
          grep -q '대표 경쟁가' ../v11.html
          test -f ../v12.html
          grep -q 'listing-prep.js' ../v12.html
          grep -q 'Shopee 등록 준비센터' ../v12.html
          test -f ../v13.html
          grep -q 'listing-prep-v13.js' ../v13.html
          grep -q '등록 직전 최종검사' ../v13.html
          grep -q 'Shopee Media' ../v13.html
          grep -q 'serverPreflight' ../listing-prep-v13.js
          grep -q 'UPLOAD_IMAGE' src/routes/candidates.js
          grep -q '/listing/preflight' src/routes/candidates.js
          test -f ../v14.html
          grep -q 'listing-prep-v14.js' ../v14.html
          grep -q 'SANDBOX PUBLISH' ../listing-prep-v14.js
          grep -q 'SHOPEE_SANDBOX_PUBLISH_ENABLED' src/routes/candidates.js
          test -f ../v15.html
          grep -q 'listing-prep-v15.js' ../v15.html
          grep -q '생성상품 API 재확인' ../listing-prep-v15.js
          grep -q '/listing/item-verify' src/routes/candidates.js
          test -f ../v16.html
          grep -q 'listing-prep-v16.js' ../v16.html
          grep -q '후보상품 → 등록초안 자동생성' ../listing-prep-v16.js
          test -f ../v17.html
          test -f ../sourcing.html
          grep -q 'listing-prep-v17.js' ../v17.html
          grep -q 'FREE SEMI-AUTO SOURCING' ../sourcing.html
          grep -q 'URL 분석' ../sourcing.html
          grep -q 'candidateId' ../listing-prep-v17.js
          test -f ../v18.html
          grep -q 'listing-prep-v18.js' ../v18.html
          grep -q 'Sandbox 등록재고는 2~100000개' ../listing-prep-v18.js
          test -f ../v19.html
          grep -q 'listing-prep-v19.js' ../v19.html
          grep -q 'prepareAllListingDrafts' ../listing-prep-v19.js
          grep -q '판매후보 전체 초안 생성' ../sourcing.html
          grep -q 'prepareAllListingDrafts' ../sourcing-v2.js
          test -f ../v20.html
          grep -q 'listing-prep-v20.js' ../v20.html
          grep -q '6개국 메타데이터 자동준비' ../v20.html
          grep -q 'prepareAllMarketMetadata' ../listing-prep-v20.js
          grep -q '미입력 필수만 보기' ../listing-prep-v20.js
          # runtime category suggestion binding must use querySelectorAll helper
          python -c 'from pathlib import Path; s=Path("../listing-prep-v20.js").read_text(); assert "$(\x27.categorySuggestion\x27).forEach" in s'
          test -f ../v21.html
          grep -q 'listing-prep-v21.js' ../v21.html
          grep -q '6개국 공통속성 자동매칭' ../v21.html
          grep -q 'autoMatchCommonAttributes' ../listing-prep-v21.js
          grep -q 'ensureAttributeMetadata(c,sourceCode,sd)' ../listing-prep-v21.js # Reload saved attribute metadata
          grep -q 'hydrateAttributeValuesFromSavedAttributes' ../listing-prep-v21.js
          grep -q 'selectedTexts' ../listing-prep-v21.js
          grep -q '기준속성 0개' ../listing-prep-v21.js
          python -c 'from pathlib import Path; s=Path("../listing-prep-v21.js").read_text(); assert "$(\x27.attrSelect\x27).forEach" in s' # attrSelect runtime binding
          grep -q '공통속성 자동매칭' ../listing-prep-v21.js
          test -f ../v22.html
          grep -q 'listing-prep-v22.js' ../v22.html
          grep -q '6개국 기준시장 자동선택·속성전파' ../v22.html
          grep -q 'selectAttributeReferenceMarket' ../listing-prep-v22.js
          grep -q '자동 기준시장' ../listing-prep-v22.js
