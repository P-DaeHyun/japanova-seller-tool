<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA V4 Workspace</title><style>:root{--bg:#080a0d;--panel:#0e1116;--panel2:#141920;--line:#222932;--text:#f3f6f8;--muted:#89939f;--mint:#55d6aa;--red:#ff737d;--amber:#efb65d}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans KR","Segoe UI",sans-serif;font-size:13px}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;background:#080a0df2;z-index:20}.brand{font-weight:900;letter-spacing:.12em;font-size:17px}.nav{display:flex;height:100%}.nav button,.subnav button{border:0;background:none;color:var(--muted);font-weight:750;cursor:pointer}.nav button{padding:0 16px;border-bottom:2px solid transparent}.nav button.active{color:white;border-color:var(--mint)}.status{margin-left:auto;color:var(--muted);font-size:10px}.dot{color:var(--mint)}main{max-width:1500px;margin:auto;padding:26px}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}.toolbar h1{font-size:22px;margin:0 auto 0 0}.btn{border:1px solid #314039;background:#14251f;color:#c8f8e7;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.gray{background:#12171d;border-color:#29313a;color:#c5ccd4}.search{width:260px;background:#0d1116;border:1px solid var(--line);border-radius:8px;padding:10px;color:white}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:13px 14px;border-bottom:1px solid #1c222a;text-align:right;white-space:nowrap}th{color:#76818d;font-size:10px;text-transform:uppercase;background:#0c0f13}th:first-child,td:first-child{text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#12171d}.grade{color:var(--mint);font-weight:900}.muted{color:var(--muted)}.empty{padding:70px;text-align:center;color:var(--muted)}.workspace-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px}.back{border:0;background:none;color:var(--muted);cursor:pointer;padding:5px 0}.workspace-head h1{margin:0 0 6px;font-size:24px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #29323b;background:#10151a;border-radius:99px;padding:5px 9px;color:#aeb7c1;font-size:10px}.chip.good{color:var(--mint);border-color:#245846}.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}.subnav button{padding:12px 15px;border-bottom:2px solid transparent}.subnav button.active{color:white;border-color:var(--mint)}.overview{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.block{padding:18px}.block h2{font-size:13px;margin:0 0 15px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field input,.field select{width:100%;background:#090c10;border:1px solid #27303a;color:white;border-radius:7px;padding:9px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:15px;background:var(--panel2);border:1px solid #252d36;border-radius:9px}.metric b{display:block;color:var(--muted);font-size:9px;margin-bottom:7px}.metric strong{font-size:20px}.markets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.market{padding:16px;cursor:pointer}.market:hover{border-color:#365c50}.market.best{border-color:#2e6b58;background:#0e1b17}.market h3{margin:0 0 14px}.market .big{font-size:24px;font-weight:900}.marketline{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted)}.detailgrid{display:grid;grid-template-columns:340px 1fr;gap:16px}.sideform{padding:17px}.sideform .field{margin-bottom:10px}.resultHero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.hero{padding:22px}.hero b{font-size:10px;color:var(--muted)}.hero strong{display:block;font-size:28px;margin-top:8px}.hero.accent{border-color:#2e6b58}.fee{padding:18px}.decision{margin-top:12px;padding:14px;border:1px solid #285746;background:#0d1b16;border-radius:9px;color:var(--mint)}.hidden{display:none!important}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scoregrid .field{padding:12px}.footer{text-align:center;color:#59636d;font-size:9px;margin-top:22px}@media(max-width:900px){.overview,.detailgrid{grid-template-columns:1fr}.markets{grid-template-columns:repeat(2,1fr)}.formgrid,.scoregrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{padding:0 12px}.nav button{padding:0 8px;font-size:11px}main{padding:14px}.toolbar{flex-wrap:wrap}.search{width:100%}.markets,.resultHero,.formgrid,.scoregrid,.metrics{grid-template-columns:1fr}.status{display:none}}</style></head><body><header class="top"><div class="brand">JAPANOVA</div><nav class="nav"><button class="active" onclick="home(this)">상품 DB</button><button onclick="openCurrent(this)">분석 워크스페이스</button></nav><div class="status"><span class="dot">●</span> V4.0 WORKSPACE · <span id="dv"></span> · <span id="sv"></span> · <span id="fv"></span></div></header><main><section id="db"><div class="toolbar"><h1>상품 DB</h1><input id="search" class="search" placeholder="상품 검색" oninput="renderDB()"><button class="btn gray" onclick="exportDB()">백업</button><label class="btn gray">불러오기<input type="file" hidden accept="application/json" onchange="importDB(this)"></label><button class="btn" onclick="newProduct()">＋ 새 상품</button></div><div class="card tablewrap" id="dbtable"></div></section><section id="ws" class="hidden"><div class="workspace-head"><button class="back" onclick="home()">← 상품 DB</button><div><h1 id="wsname">새 상품</h1><div class="chips"><span class="chip" id="wslife">후보</span><span class="chip good" id="wsgrade">시장조사 전</span><span class="chip" id="fxstatus"></span></div></div><button class="btn" style="margin-left:auto" onclick="saveProduct()">상품 저장</button></div><nav class="subnav"><button class="active" onclick="sub('overview',this)">상품 개요</button><button onclick="sub('markets',this)">6개국 비교</button><button onclick="sub('detail',this)">국가별 상세계산</button><button onclick="sub('score',this)">시장평가</button></nav><section id="overview"><div class="overview"><div class="card block"><h2>상품 기본정보</h2><div class="formgrid"><div class="field"><label>상품명</label><input id="name" value="새 상품" oninput="recalc();syncHead()"></div><div class="field"><label>매입가 (엔)</label><input id="cost" type="number" value="1000" oninput="recalc()"></div><div class="field"><label>판매단계</label><select id="life" onchange="syncHead()"><option value="Candidate">후보</option><option value="Test">테스트 판매</option><option value="Winner">주력상품</option><option value="Scale">확대판매</option></select></div><div class="field"><label>상품 자체중량 (g)</label><input id="productWeight" type="number" value="180" oninput="recalc()"></div><div class="field"><label>포장 후 중량 (g)</label><input id="packedWeightInput" type="number" value="200" oninput="recalc()"></div><div class="field"><label>포장비 (엔)</label><input id="packCostInput" type="number" value="30" oninput="recalc()"></div><div class="field"><label>국내 운임 (엔)</label><input id="domesticFare" type="number" value="1350" oninput="recalc()"></div><div class="field"><label>합배송 외부박스 (엔)</label><input id="consolBox" type="number" value="70" oninput="recalc()"></div><div class="field"><label>합배송 주문수</label><input id="orderCount" type="number" value="5" min="1" oninput="recalc()"></div></div></div><div class="card block"><h2>수익 기본설정</h2><div class="formgrid" style="grid-template-columns:repeat(2,1fr)"><div class="field"><label>목표 순이익률 (%)</label><input id="margin" type="number" value="20" oninput="recalc()"></div><div class="field"><label>Payoneer (%)</label><input id="payoneer" type="number" value="2" oninput="recalc()"></div><div class="field"><label>환율 변동 대비 (%)</label><input id="buffer" type="number" value="2" oninput="recalc()"></div><div class="field"><label>예정 할인 (%)</label><input id="discount" type="number" value="0" oninput="recalc()"></div></div><h2 style="margin-top:22px">현재 상품 요약</h2><div id="overviewMetrics" class="metrics"></div></div></div></section><section id="markets" class="hidden"><div class="toolbar"><h1>6개국 수익성 비교</h1><span class="muted">경쟁가격을 입력하면 실제 마진과 시장점수를 함께 비교해.</span></div><div id="marketCards" class="markets"></div></section><section id="detail" class="hidden"><div class="detailgrid"><div class="card sideform"><h2>판매 조건</h2><div class="field"><label>판매국</label><select id="country" onchange="calc()"></select></div><div class="field"><label>실제 등록가 (현지통화)</label><input id="actual" type="number" value="0" oninput="calc()"></div><div class="field"><label>판매자 할인쿠폰 (%)</label><input id="voucher" type="number" value="0" oninput="calc()"></div><div id="myDims" class="hidden"><div class="field"><label>가로 cm</label><input id="w" type="number" oninput="recalc()"></div><div class="field"><label>세로 cm</label><input id="d" type="number" oninput="recalc()"></div><div class="field"><label>높이 cm</label><input id="h" type="number" oninput="recalc()"></div><div id="myDimStatus" class="muted"></div></div></div><div><div id="results" class="resultHero"></div><div class="card fee"><h2>Shopee 수수료 · 배송 상세</h2><div id="feeTable" class="tablewrap"></div></div><div id="verdict" class="decision"></div></div></div></section><section id="score" class="hidden"><div class="overview"><div class="card block"><h2>6개국 경쟁가격</h2><div id="competitors" class="formgrid"></div></div><div class="card block"><h2>시장조사 평가 · 0~10</h2><div class="scoregrid"><div class="field"><label>현지 수요 22</label><input id="demand" type="number" value="5" min="0" max="10" oninput="analyze()"></div><div class="field"><label>경쟁환경 17</label><input id="competition" type="number" value="5" min="0" max="10" oninput="analyze()"></div><div class="field"><label>일본 프리미엄 8</label><input id="premium" type="number" value="5" min="0" max="10" oninput="analyze()"></div><div class="field"><label>재구매 8</label><input id="repeat" type="number" value="5" min="0" max="10" oninput="analyze()"></div><div class="field"><label>묶음판매 5</label><input id="bundle" type="number" value="5" min="0" max="10" oninput="analyze()"></div><div class="field"><label>성장성 5</label><input id="growth" type="number" value="5" min="0" max="10" oninput="analyze()"></div></div><h2 style="margin-top:20px">평가 결과</h2><div id="scoreSummary" class="metrics"></div><div id="gateBox" class="decision"></div></div></div></section></section><div class="footer">JAPANOVA V4.0 DARK WORKSPACE · 기존 V3.4 계산 로직 · SLS 2026.06.01 · 신규셀러 90일 할인 미적용</div></main><script>let data,cfg,markets=[],currentIndex=null;const $=x=>document.getElementById(x),n=x=>+$(x).value||0,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const lifeKo=v=>({Candidate:'후보',Test:'테스트 판매',Winner:'주력상품',Scale:'확대판매'}[v]||v||'후보');function home(b){$('db').classList.remove('hidden');$('ws').classList.add('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');else document.querySelector('.nav button').classList.add('active');renderDB()}function openCurrent(b){$('db').classList.add('hidden');$('ws').classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');else document.querySelectorAll('.nav button')[1].classList.add('active');syncHead();recalc()}function sub(id,b){['overview','markets','detail','score'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.subnav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='detail')calc();if(id==='markets')analyze()}function recalc(){analyze();calc();renderOverview()}function syncHead(){$('wsname').textContent=$('name').value||'새 상품';$('wslife').textContent=lifeKo($('life').value)}async function load(){data=await(await fetch('./data.json?'+Date.now())).json();cfg=structuredClone(data.markets);markets=Object.keys(cfg);$('dv').textContent='DATA '+data.dataVersion;$('sv').textContent='SLS '+data.slsRateVersion;$('country').innerHTML=markets.map(c=>`<option>${c}</option>`).join('');$('competitors').innerHTML=markets.map(c=>`<div class="field"><label>${c} (${cfg[c].cur})</label><input id="cp_${c}" type="number" value="0" oninput="analyze()"></div>`).join('');await refreshFX();renderDB()}async function refreshFX(){try{let r=await fetch('./fx.json?'+Date.now(),{cache:'no-store'}),f=await r.json();markets.forEach(c=>{if(f.jpyPer[cfg[c].cur])cfg[c].jpyPer=f.jpyPer[cfg[c].cur]});localStorage.setItem('japanova_fx_snapshot',JSON.stringify(f));$('fv').textContent='FX '+f.fxVersion;$('fxstatus').textContent='환율 정상'}catch(e){let f=JSON.parse(localStorage.getItem('japanova_fx_snapshot')||'null');if(f)markets.forEach(c=>{if(f.jpyPer[cfg[c].cur])cfg[c].jpyPer=f.jpyPer[cfg[c].cur]});$('fv').textContent='FX 저장값';$('fxstatus').textContent='저장 환율 사용'}recalc()}function packedWeight(){return n('packedWeightInput')||n('productWeight')}function packCost(){return n('packCostInput')}function domestic(){return(n('domesticFare')+n('consolBox'))/Math.max(1,n('orderCount'))}function hasMyDims(){return n('w')>0&&n('d')>0&&n('h')>0}function volumetricWeight(){return hasMyDims()?n('w')*n('d')*n('h')/6000*1000:0}function chargeWeight(c){let g=packedWeight();if(c==='말레이시아'&&hasMyDims())g=Math.max(g,volumetricWeight());return g}function ship(c){let g=chargeWeight(c),s=cfg[c].sls;if(s.kind==='step50'){let w=Math.ceil(g/50)*50,over=w>s.maxG;w=Math.min(w,s.maxG);return{weight:w,net:Math.max(0,s.base+s.step*(w/50)),over}}if(s.kind==='sg20260601'){let over=g>30000,w,net;if(g<=500){w=Math.max(100,Math.ceil(g/100)*100);net=2.63+.23*(w/100-1)}else{w=Math.min(30000,500+Math.ceil((g-500)/250)*250);net=3.55+2.5*((w-500)/250)}return{weight:w,net,over}}if(s.kind==='vn20260601'){let over=g>20000,w=Math.min(20000,Math.max(50,Math.ceil(g/50)*50)),net=w<=800?5500+11500*(w/50-1):188500+10500*((w-850)/50);return{weight:w,net,over}}return{weight:g,net:0,over:true}}function feeDetails(c,full,effective){return cfg[c].feeItems.map(it=>({name:it.name,rate:it.rate,base:it.base,amount:(it.base==='effective'?effective:full)*it.rate}))}function evaluateAt(c,list,voucher=0){let x=cfg[c],baseFx=x.jpyPer,priceFx=baseFx*(1-n('buffer')/100),effective=list*(1-voucher/100)*(1-n('discount')/100),s=ship(c),slsJPY=s.net*baseFx,f=feeDetails(c,list,effective),feesLocal=f.reduce((a,b)=>a+b.amount,0),revenueJPY=effective*priceFx,shopeeFeeJPY=feesLocal*baseFx,settlement=revenueJPY-shopeeFeeJPY-slsJPY,payoneer=effective*baseFx*n('payoneer')/100,local=n('cost')+packCost()+domestic(),profit=settlement-local-payoneer,pm=revenueJPY?profit/revenueJPY:0;return{listLocal:list,effective,baseFx,priceFx,s,slsJPY,f,feesLocal,revenueJPY,shopeeFeeJPY,shopeeSettlementJPY:settlement,payoneerJPY:payoneer,localCostJPY:local,profit,pm}}function target(c,v=0){let lo=.01,hi=100;while(evaluateAt(c,hi,v).pm<n('margin')/100&&hi<1e9)hi*=2;for(let i=0;i<60;i++){let mid=(lo+hi)/2;if(evaluateAt(c,mid,v).pm>=n('margin')/100)hi=mid;else lo=mid}return evaluateAt(c,Math.ceil(hi),v)}function marginScore(pm){let p=pm*100,s;if(p<10)s=0;else if(p<15)s=5+p-10;else if(p<20)s=10+p-15;else if(p<25)s=15+(p-20)*.6;else if(p<30)s=18+(p-25)*.4;else s=20;return s*1.1}function shipScore(r){let q=(r.slsJPY+domestic())/Math.max(1,r.revenueJPY);return q<=.1?13:q<=.15?11:q<=.2?9:q<=.25?6:q<=.3?3:0}function manual(id,max){return clamp(n(id),0,10)/10*max}function analyze(){if(!cfg)return;let rows=markets.map(c=>{let cp=+$('cp_'+c).value||0,r=cp?evaluateAt(c,cp):null,t=target(c),comp=manual('competition',17);if(cp){let q=t.listLocal/cp;comp=clamp(comp+(q<=1?2:q<=1.1?1:q>1.3?-3:q>1.15?-1:0),0,17)}let parts={demand:manual('demand',22),competition:comp,margin:r?marginScore(r.pm):0,premium:manual('premium',8),shipping:shipScore(r||t),repeat:manual('repeat',8),bundle:manual('bundle',5),growth:manual('growth',5)},score=Object.values(parts).reduce((a,b)=>a+b,0);return{c,cp,r,t,score}}),researched=rows.filter(x=>x.cp),best=researched.length?[...researched].sort((a,b)=>b.score-a.score)[0]:null,gates=[];if(researched.length&&researched.every(x=>x.r.pm<.1))gates.push('조사한 모든 시장 예상마진 10% 미만');if(n('demand')<=2)gates.push('현지 수요 근거 부족');let score=best?best.score:0,grade=score>=90?'SS':score>=80?'S':score>=70?'A':score>=60?'B':'C';if(!researched.length&&['SS','S'].includes(grade))grade='A';if(gates.length&&['SS','S'].includes(grade))grade='A(보류조건)';let action=!researched.length?'시장조사 필요':gates.length?'보류/조건 개선':score>=90?'즉시 테스트 후보':score>=80?'강력 테스트 후보':score>=70?'조건부 테스트':score>=60?'개선 후 재검토':'보류';window.lastEval={score,grade,action,best:best?.c||null,rows:rows.map(x=>({country:x.c,score:x.score,margin:x.r?.pm??null,target:x.t.listLocal}))};$('wsgrade').textContent=best?`${grade} · ${best.c}`:'시장조사 전';$('marketCards').innerHTML=rows.map(x=>`<div class="card market ${best&&best.c===x.c?'best':''}" onclick="openMarket('${x.c}')"><h3>${x.c}${best&&best.c===x.c?' · 최적 시장':''}</h3><div class="big">${x.score.toFixed(1)} <span class="grade">${x.score>=90?'SS':x.score>=80?'S':x.score>=70?'A':x.score>=60?'B':'C'}</span></div><div class="marketline"><span>권장가</span><b>${x.t.listLocal} ${cfg[x.c].cur}</b></div><div class="marketline"><span>경쟁가 마진</span><b>${x.r?(x.r.pm*100).toFixed(1)+'%':'-'}</b></div><div class="marketline"><span>SLS</span><b>${x.t.s.net.toFixed(2)} ${cfg[x.c].cur}</b></div></div>`).join('');$('scoreSummary').innerHTML=`<div class="metric"><b>최적 시장</b><strong>${best?best.c:'-'}</strong></div><div class="metric"><b>대표점수 / 등급</b><strong>${best?score.toFixed(1)+' / '+grade:'-'}</strong></div><div class="metric"><b>판정</b><strong style="font-size:15px">${action}</strong></div><div class="metric"><b>국내배송 배분</b><strong>¥${Math.round(domestic())}</strong></div>`;$('gateBox').textContent=gates.length?'보류조건 · '+gates.join(' / '):!researched.length?'경쟁가격을 입력하면 평가가 시작돼.':'보류조건 없음';renderOverview()}function rende
