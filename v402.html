<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPANOVA V4.0.2</title><style>:root{--b:#080a0d;--p:#0f1318;--p2:#151b22;--l:#252d36;--t:#f4f7f8;--m:#87929e;--g:#55d6aa}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:13px Inter,'Noto Sans KR','Segoe UI',sans-serif}.top{height:62px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 24px;gap:28px}.brand{font-weight:900;letter-spacing:.12em;font-size:18px}.nav button,.tabs button{border:0;background:none;color:var(--m);font-weight:800;cursor:pointer}.nav button{height:62px;padding:0 15px;border-bottom:2px solid transparent}.nav button.on,.tabs button.on{color:#fff;border-color:var(--g)}.stat{margin-left:auto;color:var(--m);font-size:10px}.stat b{color:var(--g)}main{max-width:1440px;margin:auto;padding:28px}.row,.head{display:flex;gap:10px;align-items:center}.row h1{margin-right:auto}.btn{border:1px solid #2d443b;background:#12241e;color:#caffed;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.gray{background:#12171d;border-color:var(--l);color:#c8d0d8}input,select{background:#090c10;border:1px solid var(--l);border-radius:7px;color:#fff;padding:9px;width:100%}.search{max-width:260px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px}.table{overflow:auto;margin-top:16px}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #1d242c;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--m);font-size:10px}.empty{text-align:center;padding:70px;color:var(--m)}.hide{display:none!important}.head{align-items:flex-start}.head h1{margin:0 0 6px}.muted{color:var(--m)}.tabs{display:flex;border-bottom:1px solid var(--l);margin:20px 0}.tabs button{padding:12px 15px;border-bottom:2px solid transparent}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.box{padding:18px}.box h2{font-size:13px;margin:0 0 15px}.fields,.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--m);font-size:10px;margin-bottom:5px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:var(--p2);border:1px solid var(--l);border-radius:9px;padding:15px}.metric span{display:block;color:var(--m);font-size:9px;margin-bottom:7px}.metric b{font-size:20px}.markets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.market{padding:17px;cursor:pointer}.market:hover{border-color:#346553}.market h3{margin:0 0 14px}.big{font-size:25px;font-weight:900;color:var(--g)}.line{display:flex;justify-content:space-between;color:var(--m);margin-top:8px}.detail{display:grid;grid-template-columns:330px 1fr;gap:16px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hero{padding:20px}.hero span{color:var(--m);font-size:10px}.hero b{display:block;font-size:26px;margin-top:8px}.accent{border-color:#2d6754}.foot{text-align:center;color:#56616b;font-size:9px;margin-top:25px}@media(max-width:800px){.grid,.detail{grid-template-columns:1fr}.markets,.fields,.score,.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{padding:14px}.stat{display:none}.markets,.fields,.score,.results,.metrics{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">JAPANOVA</div><nav class="nav"><button id="ndb" class="on">상품 DB</button><button id="nws">분석 워크스페이스</button></nav><div class="stat"><b>●</b> V4.0.2 · DATA 3.2.5 · SLS 2026.06.01</div></header><main><section id="db"><div class="row"><h1>상품 DB</h1><input id="q" class="search" placeholder="상품 검색"><button id="backup" class="btn gray">백업</button><button id="new" class="btn">＋ 새 상품</button></div><div id="tbl" class="card table"><div class="empty">저장된 상품이 없어.<br><br><button class="btn" id="first">＋ 첫 상품 만들기</button></div></div></section><section id="ws" class="hide"><div class="head"><button id="back" class="btn gray">← DB</button><div><h1 id="title">새 상품</h1><div class="muted" id="subtitle">후보 · 시장조사 전</div></div><button id="save" class="btn" style="margin-left:auto">상품 저장</button></div><nav class="tabs"><button class="on" data-tab="overview">상품 개요</button><button data-tab="markets">6개국 비교</button><button data-tab="detail">국가별 상세계산</button><button data-tab="score">시장평가</button></nav><section id="overview"><div class="grid"><div class="card box"><h2>상품 기본정보</h2><div class="fields"><div class="field"><label>상품명</label><input id="name" value="새 상품"></div><div class="field"><label>매입가 JPY</label><input id="cost" type="number" value="1000"></div><div class="field"><label>판매단계</label><select id="life"><option>후보</option><option>테스트 판매</option><option>주력상품</option><option>확대판매</option></select></div><div class="field"><label>상품 자체중량 g</label><input id="weight" type="number" value="180"></div><div class="field"><label>포장 후 중량 g</label><input id="packed" type="number" value="200"></div><div class="field"><label>포장비 JPY</label><input id="pack" type="number" value="30"></div><div class="field"><label>국내 운임 JPY</label><input id="dom" type="number" value="1350"></div><div class="field"><label>합배송 박스 JPY</label><input id="box" type="number" value="70"></div><div class="field"><label>합배송 주문수</label><input id="orders" type="number" value="5"></div></div></div><div class="card box"><h2>수익 기본설정</h2><div class="fields"><div class="field"><label>목표 순이익률 %</label><input id="margin" type="number" value="20"></div><div class="field"><label>Payoneer %</label><input id="pay" type="number" value="2"></div><div class="field"><label>환율 버퍼 %</label><input id="buffer" type="number" value="2"></div></div><h2 style="margin-top:22px">상품 요약</h2><div id="summary" class="metrics"></div></div></div></section><section id="markets" class="hide"><div id="marketcards" class="markets"></div></section><section id="detail" class="hide"><div class="detail"><div class="card box"><h2>판매 조건</h2><div class="field"><label>판매국</label><select id="country"></select></div><div class="field" style="margin-top:10px"><label>실제 등록가</label><input id="actual" type="number" value="0"></div><div class="field" style="margin-top:10px"><label>판매자 쿠폰 %</label><input id="voucher" type="number" value="0"></div></div><div><div id="results" class="results"></div><div class="card box" style="margin-top:12px"><h2>비용 상세</h2><div id="fees"></div></div></div></div></section><section id="score" class="hide"><div class="grid"><div class="card box"><h2>6개국 경쟁가격</h2><div id="competitors" class="fields"></div></div><div class="card box"><h2>시장조사 평가 · 0~10</h2><div class="score"><div class="field"><label>현지 수요 22</label><input id="demand" type="number" value="5"></div><div class="field"><label>경쟁환경 17</label><input id="competition" type="number" value="5"></div><div class="field"><label>일본 프리미엄 8</label><input id="premium" type="number" value="5"></div><div class="field"><label>재구매 8</label><input id="repeat" type="number" value="5"></div><div class="field"><label>묶음판매 5</label><input id="bundle" type="number" value="5"></div><div class="field"><label>성장성 5</label><input id="growth" type="number" value="5"></div></div><h2 style="margin-top:20px">평가 결과</h2><div id="eval" class="metrics"></div></div></div></section></section><div class="foot">JAPANOVA V4.0.2 DARK WORKSPACE · SLS 2026.06.01 · 신규셀러 90일 할인 미적용</div></main><script>(function(){'use strict';const M={대만:{cur:'TWD',fx:4.867,fee:.1825},싱가포르:{cur:'SGD',fx:121.551,fee:.1875},말레이시아:{cur:'MYR',fx:37.8917,fee:.2295},태국:{cur:'THB',fx:4.6498,fee:.2434},필리핀:{cur:'PHP',fx:2.4572,fee:.188},베트남:{cur:'VND',fx:.006,fee:.285}},N=Object.keys(M),$=x=>document.getElementById(x),n=x=>Number($(x)?.value)||0;let idx=null,last={};function sls(c){let g=n('packed')||n('weight');if(c==='대만')return 23.7+6.5*Math.ceil(g/50);if(c==='싱가포르'){if(g<=500)return 2.63+.23*(Math.max(100,Math.ceil(g/100)*100)/100-1);let w=500+Math.ceil((g-500)/250)*250;return 3.55+2.5*((w-500)/250)}if(c==='말레이시아')return .85*Math.ceil(g/50);if(c==='태국')return 28+12*Math.ceil(g/50);if(c==='필리핀')return -19+25*Math.ceil(g/50);let w=Math.max(50,Math.ceil(g/50)*50);return w<=800?5500+11500*(w/50-1):188500+10500*((w-850)/50)}function dom(){return(n('dom')+n('box'))/Math.max(1,n('orders'))}function at(c,p,v=0){let m=M[c],e=p*(1-v/100),rev=e*m.fx*(1-n('buffer')/100),ship=sls(c)*m.fx,fee=p*m.fee*m.fx,pay=e*m.fx*n('pay')/100,profit=rev-fee-ship-pay-n('cost')-n('pack')-dom();return{p,rev,ship,fee,pay,profit,pm:rev?profit/rev:0}}function target(c,v=0){let lo=.01,hi=100;while(at(c,hi,v).pm<n('margin')/100&&hi<1e9)hi*=2;for(let i=0;i<55;i++){let x=(lo+hi)/2;if(at(c,x,v).pm>=n('margin')/100)hi=x;else lo=x}return at(c,Math.ceil(hi),v)}function grade(s){return s>=90?'SS':s>=80?'S':s>=70?'A':s>=60?'B':'C'}function run(){$('title').textContent=$('name').value||'새 상품';let rows=N.map(c=>{let cp=n('cp_'+c),r=cp?at(c,cp):null,t=target(c),base=n('demand')/10*22+n('competition')/10*17+n('premium')/10*8+n('repeat')/10*8+n('bundle')/10*5+n('growth')/10*5,ms=r?Math.max(0,Math.min(22,(r.pm*100-5)*1.1)):0,ss=Math.max(0,13-(t.ship+dom())/Math.max(1,t.rev)*35);return{c,cp,r,t,score:Math.min(100,base+ms+ss)}}),best=rows.filter(x=>x.cp).sort((a,b)=>b.score-a.score)[0];last={rows,best:best?.c||null,score:best?.score||0,grade:best?grade(best.score):'-'};$('subtitle').textContent=$('life').value+' · '+(best?best.c+' '+grade(best.score):'시장조사 전');$('summary').innerHTML=`<div class="metric"><span>포장 후 중량</span><b>${n('packed')}g</b></div><div class="metric"><span>국내배송 배분</span><b>¥${Math.round(dom())}</b></div><div class="metric"><span>최적 시장</span><b>${best?.c||'-'}</b></div><div class="metric"><span>대표 등급</span><b>${best?grade(best.score):'-'}</b></div>`;$('marketcards').innerHTML=rows.map(x=>`<div class="card market" data-c="${x.c}"><h3>${x.c}</h3><div class="big">${x.score.toFixed(1)} ${grade(x.score)}</div><div class="line"><span>권장가</span><b>${x.t.p} ${M[x.c].cur}</b></div><div class="line"><span>경쟁가 마진</span><b>${x.r?(x.r.pm*100).toFixed(1)+'%':'-'}</b></div></div>`).join('');$('eval').innerHTML=`<div class="metric"><span>최적 시장</span><b>${best?.c||'-'}</b></div><div class="metric"><span>대표점수 / 등급</span><b>${best?best.score.toFixed(1)+' / '+grade(best.score):'-'}</b></div>`;calc()}function calc(){let c=$('country').value||N[0],v=n('voucher'),t=target(c,v),r=n('actual')?at(c,n('actual'),v):t;$('results').innerHTML=`<div class="card hero accent"><span>목표 등록가</span><b>${t.p} ${M[c].cur}</b></div><div class="card hero accent"><span>최종 순이익</span><b>¥${Math.round(r.profit).toLocaleString()}</b></div><div class="card hero"><span>순이익률</span><b>${(r.pm*100).toFixed(2)}%</b></div>`;$('fees').innerHTML=`<table><tr><th>항목</th><th>금액</th></tr><tr><td>Shopee 수수료</td><td>¥${Math.round(r.fee)}</td></tr><tr><td>SLS</td><td>¥${Math.round(r.ship)}</td></tr><tr><td>Payoneer</td><td>¥${Math.round(r.pay)}</td></tr><tr><td>국내배송 배분</td><td>¥${Math.round(dom())}</td></tr></table>`}function showDB(){$('db').classList.remove('hide');$('ws').classList.add('hide');$('ndb').classList.add('on');$('nws').classList.remove('on');drawDB()}function showWS(){$('db').classList.add('hide');$('ws').classList.remove('hide');$('ndb').classList.remove('on');$('nws').classList.add('on');run()}function tab(id,b){['overview','markets','detail','score'].forEach(x=>$(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='detail')calc()}function fresh(){idx=null;$('name').value='새 상품';N.forEach(c=>$('cp_'+c).value=0);showWS();tab('overview',document.querySelector('[data-tab="overview"]'))}function snap(){let o={};['name','cost','life','weight','packed','pack','dom','box','orders','margin','pay','buffer','demand','competition','premium','repeat','bundle','growth'].forEach(k=>o[k]=$(k).value);o.competitors={};N.forEach(c=>o.competitors[c]=n('cp_'+c));o.evaluation=last;o.saved=new Date().toLocaleString();return o}function saveP(){let db;try{db=JSON.parse(localStorage.getItem('japanova_products_v32')||'[]')}catch(e){db=[]}let p=snap();if(idx===null){db.unshift(p);idx=0}else db[idx]=p;localStorage.setItem('japanova_products_v32',JSON.stringify(db));alert('V4.0.2 상품 저장 완료')}function drawDB(){let db;try{db=JSON.parse(localStorage.getItem('japanova_products_v32')||'[]')}catch(e){db=[]}let q=($('q').value||'').toLowerCase(),a=db.map((p,i)=>({p,i})).filter(x=>(x.p.name||'').toLowerCase().includes(q));$('tbl').innerHTML=a.length?`<table><tr><th>상품명</th><th>판매단계</th><th>최적 시장</th><th>점수</th><th>등급</th><th>저장일</th></tr>${a.map(x=>`<tr data-i="${x.i}"><td><b>${x.p.name||'이름 없음'}</b></td><td>${x.p.life||'-'}</td><td>${x.p.evaluation?.best||'-'}</td><td>${typeof x.p.evaluation?.score==='number'?x.p.evaluation.score.toFixed(1):'-'}</td><td>${x.p.evaluation?.grade||'-'}</td><td>${x.p.saved||'-'}</td></tr>`).join('')}</table>`:'<div class="empty">저장된 상품이 없어.<br><br><button class="btn" id="first2">＋ 첫 상품 만들기</button></div>';$('first2')?.addEventListener('click',fresh);document.querySelectorAll('#tbl tr[data-i]').forEach(r=>r.addEventListener('click',()=>loadP(Number(r.dataset.i))))}function loadP(i){let p=JSON.parse(localStorage.getItem('japanova_products_v32')||'[]')[i];if(!p)return;idx=i;['name','cost','life','weight','packed','pack','dom','box','orders','margin','pay','buffer','demand','competition','premium','repeat','bundle','growth'].forEach(k=>{if(p[k]!=null)$(k).value=p[k]});N.forEach(c=>$('cp_'+c).value=p.competitors?.[c]||0);showWS();tab('overview',document.querySelector('[data-tab="overview"]'))}function backup(){let s=localStorage.getItem('japanova_products_v32')||'[]',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='JAPANOVA_V402_products.json';a.click()}function init(){$('country').innerHTML=N.map(c=>`<option>${c}</option>`).join('');$('competitors').innerHTML=N.map(c=>`<div class="field"><label>${c} (${M[c].cur})</label><input id="cp_${c}" type="number" value="0"></div>`).join('');$('ndb').onclick=showDB;$('nws').onclick=showWS;$('new').onclick=fresh;$('first').onclick=fresh;$('back').onclick=showDB;$('save').onclick=saveP;$('backup').onclick=backup;$('q').oninput=drawDB;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab,b));document.querySelectorAll('#ws input,#ws select').forEach(x=>x.oninput=run);$('country').onchange=calc;$('marketcards').onclick=e=>{let c=e.target.closest('[data-c]');if(c){$('country').value=c.dataset.c;tab('detail',document.querySelector('[data-tab="detail"]'))}};drawDB();run()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></body></html>
